<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tela dos jogadores</title>
<style>
:root{--ouro:#e0b24a;--texto:#efe6d6;--apagado:#a89a85}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--texto);font:16px/1.4 system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#im{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .6s}
#im.vis{opacity:1}
.gira{right:auto!important;bottom:auto!important;left:50%!important;top:50%!important;width:100vh!important;height:100vw!important;width:100dvh!important;height:100dvw!important;transform:translate(-50%,-50%) rotate(var(--s,90deg))}
#car{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#000;overscroll-behavior:contain;touch-action:pan-x}
#car::-webkit-scrollbar{display:none}
#car[hidden]{display:none}
.sl{flex:none;width:100vw;height:100%;position:relative;scroll-snap-align:center;scroll-snap-stop:always}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sl .nome{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font:italic 600 clamp(18px,4vmin,34px)/1.2 Georgia,serif;color:#f1e2c0;text-shadow:0 2px 10px #000,0 0 3px #000}
#bar{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:9px 20px;border-radius:999px;background:rgba(10,8,6,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);z-index:5}
#bar[hidden]{display:none}
#bar i{display:block;width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:transparent;transition:transform .25s,background .25s,border-color .25s;cursor:pointer}
#bar i.on{background:var(--ouro);border-color:var(--ouro);transform:scale(1.3)}
#cx{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:#000}
#cx[hidden]{display:none}
#cx h1{font:600 22px/1.2 Georgia,serif;margin:0;color:var(--ouro);letter-spacing:.04em}
#cx p{margin:0;color:var(--apagado);max-width:34em}
#cod{font:700 34px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:lowercase;width:7em;text-align:center;background:#16110d;color:var(--texto);border:1px solid #3a2e24;border-radius:10px;padding:12px 8px}
button{font:inherit;background:#c8672f;color:#1a0d04;border:0;border-radius:10px;padding:13px 26px;font-weight:700;min-height:48px}
#rodar{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:6;width:52px;height:52px;min-height:0;padding:0;border-radius:50%;background:rgba(10,8,6,.45);color:#f1e2c0;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;opacity:.45;transition:opacity .3s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#rodar:active,#rodar:hover{opacity:1}
#rodar svg{width:26px;height:26px}
.gira2{transform:rotate(180deg)}
#pt{position:fixed;right:12px;bottom:12px;width:10px;height:10px;border-radius:50%;background:#7a2a1c;opacity:.55;transition:opacity 2s .5s,background .3s}
#pt.on{background:#3d8a4a}
#pt.quieto{opacity:0}

/* ---- modo online: esta aba é compartilhada no Meet (imagem, iniciativa e o som da mesa) ---- */
body.online #rodar,body.online #pt{display:none}
#ov-som{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:rgba(0,0,0,.92)}
#ov-som[hidden]{display:none}
#ov-som h1{font:600 24px/1.2 Georgia,serif;margin:0;color:var(--ouro)}
#ov-som p{margin:0;color:var(--apagado);max-width:36em}
#pub{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));z-index:5;display:none;flex-direction:column;gap:8px;min-width:190px;max-width:min(30vw,320px);padding:12px 14px;border-radius:14px;background:rgba(10,8,6,.62);border:1px solid rgba(224,178,74,.25);backdrop-filter:blur(3px)}
#pub.vis{display:flex}
#pubTopo{font:700 clamp(15px,2.2vmin,22px)/1.2 Georgia,serif;color:var(--ouro)}
#pubIni{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#pubIni li{padding:5px 10px;border-radius:8px;font:600 clamp(14px,2vmin,20px)/1.2 system-ui,sans-serif;color:#e8dcc6;background:rgba(255,255,255,.06);border-left:4px solid #6f6150}
#pubIni li.inim{border-left-color:#b9442f}
#pubIni li.ativo{background:rgba(224,178,74,.22);color:#fff;border-left-color:var(--ouro);transform:translateX(-6px)}
#pubNp{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:5;display:none;padding:7px 14px;border-radius:999px;background:rgba(10,8,6,.55);color:#e8dcc6;font:600 clamp(13px,1.8vmin,18px)/1.2 system-ui,sans-serif}
#pubNp.vis{display:block}
</style>
</head>
<body>
<img id="im" alt="">
<div id="car" hidden></div>
<div id="bar" hidden></div>
<button id="rodar" type="button" aria-label="Girar a imagem" title="Girar a imagem 90°"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
<div id="pt" title="conexão"></div>
<div id="cx">
  <h1>Tela dos jogadores</h1>
  <p id="msg">Digite o código que aparece na aba Imagens do notebook.</p>
  <input id="cod" maxlength="6" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Código">
  <button id="ok">Conectar e abrir em tela cheia</button>
</div>
<div id="ov-som" hidden>
  <h1>Transmissão da mesa</h1>
  <p id="ov-msg">Clique uma vez para liberar o som desta aba. Depois, no Meet: Apresentar agora › Uma guia › esta aba, com “Compartilhar áudio da guia” marcado.</p>
  <button id="ligaSom" type="button">Liberar o som</button>
</div>
<div id="pub" aria-live="polite"><div id="pubTopo"></div><ol id="pubIni"></ol></div>
<div id="pubNp"></div>
<div id="ytHost" style="position:fixed;left:-9999px;top:0;width:200px;height:200px" aria-hidden="true"><div id="y0"></div><div id="y1"></div><div id="y2"></div></div>
<script src="ponte.js?v=1"></script>
<script src="au.js?v=1"></script>
<script>
(function(){
  'use strict';
  var im = document.getElementById('im'), cx = document.getElementById('cx'), cod = document.getElementById('cod'), pt = document.getElementById('pt'), msg = document.getElementById('msg');
  var ponte = null, atual = '', trava = null, bat = 0;
  function lerCodigo(){ var h = Ponte.limpa(location.hash.slice(1)); if (h) return h; try { return Ponte.limpa(localStorage.getItem('otl-sala-tablet')); } catch(e){ return ''; } }
  var car = document.getElementById('car'), bar = document.getElementById('bar'), modoCar = false, prog = false, nSl = 0, focoAtual = -1, tFoco = 0;
  var ROT = {};   // giro extra escolhido no botão, por imagem (0, 90, 180, 270)
  function giraImg(el){
    var deitar = el.dataset.g === '1' && el.naturalWidth > el.naturalHeight && innerHeight > innerWidth;
    var t = ((deitar ? (el.dataset.s === '-90' ? -90 : 90) : 0) + (ROT[el.src] || 0)) % 360; if (t < 0) t += 360;
    el.classList.toggle('gira', t % 180 !== 0); el.classList.toggle('gira2', t === 180); el.style.setProperty('--s', t + 'deg');
  }
  function rodar(){
    var el = modoCar ? (car.children[focoAtual] && car.children[focoAtual].querySelector('img')) : (im.classList.contains('vis') ? im : null);
    if (!el || !el.src) return;
    ROT[el.src] = ((ROT[el.src] || 0) + 90) % 360; giraImg(el);
  }
  var bRodar = document.getElementById('rodar');
  bRodar.addEventListener('click', function(e){ e.stopPropagation(); rodar(); });
  bRodar.addEventListener('dblclick', function(e){ e.stopPropagation(); });
  function giraTudo(){ giraImg(im); car.querySelectorAll('img').forEach(giraImg); }
  addEventListener('resize', giraTudo); addEventListener('orientationchange', function(){ setTimeout(giraTudo, 200); });
  function saiCar(){ modoCar = false; car.hidden = true; bar.hidden = true; car.replaceChildren(); nSl = 0; focoAtual = -1; }
  function mostra(u, g, sent){
    u = u || ''; saiCar();
    var chave = u + '|' + g + '|' + sent;
    if (chave === atual) return; atual = chave;
    if (!u) { im.classList.remove('vis'); return; }
    var url = /^https?:/i.test(u) ? u : new URL(u, location.href).href;
    var pre = new Image();
    pre.onload = function(){ if (atual !== chave) return; im.classList.remove('vis'); setTimeout(function(){ if (atual !== chave) return;
      im.dataset.g = g ? '1' : '0'; im.dataset.s = String(sent); im.onload = function(){ giraImg(im); im.classList.add('vis'); }; im.src = url; if (im.complete && im.naturalWidth) { giraImg(im); im.classList.add('vis'); } }, 350); };
    pre.onerror = function(){ if (atual === chave) im.classList.remove('vis'); };
    pre.src = url;
  }
  function foca(i, aviso){
    if (i < 0 || i >= nSl) return;
    prog = !!aviso; car.scrollTo({left: i * car.clientWidth, behavior: aviso ? 'smooth' : 'auto'});
    marca(i); if (aviso) setTimeout(function(){ prog = false; }, 700);
  }
  function marca(i){ focoAtual = i; Array.prototype.forEach.call(bar.children, function(d, k){ d.classList.toggle('on', k === i); }); }
  function mostraCar(m){
    atual = ''; im.classList.remove('vis'); saiCar(); modoCar = true;
    var it = Array.isArray(m.it) ? m.it : [];
    it.forEach(function(x, k){
      var sl = document.createElement('div'); sl.className = 'sl'; var e = document.createElement('img'); e.alt = '';
      e.dataset.g = m.g ? '1' : '0'; e.dataset.s = String(m.s); e.onload = function(){ giraImg(e); };
      e.src = /^https?:/i.test(x.u) ? x.u : new URL(x.u, location.href).href; sl.append(e);
      if (m.nm && x.n) { var n = document.createElement('div'); n.className = 'nome'; n.textContent = x.n; sl.append(n); }
      car.append(sl);
      var d = document.createElement('i'); d.onclick = function(){ foca(k, true); anuncia(k); }; bar.append(d); });
    nSl = it.length; bar.hidden = nSl < 2; car.hidden = false;
    foca(Math.min(Math.max(+m.i || 0, 0), nSl - 1), false); anuncia(focoAtual);
  }
  function anuncia(i){ if (ponte) ponte.enviar({t:'foco', i: i, n: nSl}); }
  car.addEventListener('scroll', function(){
    clearTimeout(tFoco); tFoco = setTimeout(function(){
      var i = Math.round(car.scrollLeft / Math.max(1, car.clientWidth)); if (i === focoAtual) return; marca(i); if (!prog) anuncia(i); }, 140);
  }, {passive:true});
  function recebe(m){
    if (m.t === 'img') mostra(m.u, m.g, m.s === -90 ? -90 : 90);
    else if (m.t === 'preto' || m.t === 'limpa') mostra('', 0, 90);
    else if (m.t === 'car') mostraCar(m);
    else if (m.t === 'foco' && modoCar) foca(+m.i, true);
  }
  function conecta(c){
    c = Ponte.limpa(c); if (!c) return false;
    try { localStorage.setItem('otl-sala-tablet', c); } catch(e){}
    if (ponte) ponte.fechar();
    ponte = Ponte.abrir(c, recebe, function(st){ pt.className = st === 'on' ? 'on' : ''; if (st === 'on') { ponte.enviar({t:'oi'}); } });
    ponte.enviar({t:'oi'});
    clearInterval(bat); bat = setInterval(function(){ if (ponte) ponte.enviar({t:'vivo'}); }, 25000);
    return true;
  }
  function entra(){
    var c = Ponte.limpa(cod.value); if (!c) { cod.focus(); return; }
    conecta(c); cx.hidden = true;
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){}); } catch(e){}
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ trava = w; }).catch(function(){}); } catch(e){}
    setTimeout(function(){ pt.classList.add('quieto'); }, 6000);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    if (cx.hidden && navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ trava = w; }).catch(function(){});
    if (ponte) ponte.enviar({t:'oi'});
  });
  document.addEventListener('dblclick', function(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(function(){}); });
  document.addEventListener('click', function(){ if (!cx.hidden) return; pt.classList.remove('quieto'); setTimeout(function(){ pt.classList.add('quieto'); }, 3000); });
  document.getElementById('ok').onclick = entra;
  cod.addEventListener('keydown', function(e){ if (e.key === 'Enter') entra(); });
  var c0 = lerCodigo(); if (c0) { cod.value = c0; msg.textContent = 'Toque para abrir em tela cheia. O aparelho não vai apagar a tela.'; }
  if (/[?&]online\b/.test(location.search)) { if (c0) { conecta(c0); } cx.hidden = true; }
})();
</script>
<script>
/* Modo online (tela.html?online#código): esta aba toca a música e os sons da mesa e mostra imagem + iniciativa.
   A aba do Mestre (combate.html) manda as ordens pelo BroadcastChannel 'otl-som' (só neste navegador, sem internet). */
(function(){
  'use strict';
  if (!/[?&]online\b/.test(location.search)) return;
  document.body.classList.add('online');
  var bc = null; try { bc = new BroadcastChannel('otl-som'); } catch(e){ return; }
  var P = [null, null, null], pronto = [false, false, false], liberado = false;
  function env(m){ try { bc.postMessage(m); } catch(e){} }
  var ov = document.getElementById('ov-som'); ov.hidden = false;
  var S = {vol:70}, AU = OTL_AU(S), GEN = {}, LOOPS = {};
  var SIN = {katana:'flecha', passos:'tambor', dragao:'rosnado', asas:'chifre', fogoSopro:'trovao'};
  var volG = function(){ return Math.min(1, S.vol / 100 * 1.15); };
  var SOM = {
    efeito: function(id){ var u = GEN['fx|' + id]; if (!u) return AU.efeito(SIN[id] || id); var a = new Audio(u); a.volume = volG(); a.play().catch(function(){ AU.efeito(SIN[id] || id); }); },
    liga: function(id, nv){ var u = GEN['cam|' + id]; if (!u) return AU.liga(id, nv); if (LOOPS[id]) return; var a = new Audio(u); a.loop = true; a.volume = Math.min(1, nv * volG() * 1.6); LOOPS[id] = a; a.play().catch(function(){}); },
    nivel: function(id, nv){ if (LOOPS[id]) LOOPS[id].volume = Math.min(1, nv * volG() * 1.6); else AU.nivel(id, nv); },
    desliga: function(id){ var a = LOOPS[id]; if (a) { delete LOOPS[id]; a.pause(); } else AU.desliga(id); },
    tudo: function(){ Object.keys(LOOPS).forEach(function(k){ LOOPS[k].pause(); delete LOOPS[k]; }); AU.tudo(); },
    mestre: function(p){ AU.mestre(+p); Object.keys(LOOPS).forEach(function(k){}); }
  };
  /* sons gerados: os que estão no repositório (audio/manifest.json) e os que o Mestre gerou neste navegador (IndexedDB) */
  function carregaGerados(){
    try { fetch('audio/manifest.json', {cache:'no-cache'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(m){ if (!m) return;
      ['fx', 'cam'].forEach(function(t){ Object.keys(m[t] || {}).forEach(function(id){ if (!GEN[t + '|' + id]) GEN[t + '|' + id] = 'audio/' + m[t][id]; }); }); }).catch(function(){}); } catch(e){}
    try { var r = indexedDB.open('otl_falas', 1); r.onsuccess = function(){ try { var q = r.result.transaction('a').objectStore('a').openCursor(); q.onsuccess = function(){ var c = q.result; if (!c) return;
      var k = String(c.key); if (/^(fx|cam)\|/.test(k) && !GEN[k]) GEN[k] = URL.createObjectURL(c.value); c.continue(); }; } catch(e){} }; } catch(e){}
  }
  carregaGerados(); setInterval(carregaGerados, 20000);
  /* YouTube */
  window.onYouTubeIframeAPIReady = function(){ [0, 1, 2].forEach(function(i){ P[i] = new YT.Player('y' + i, {width:'100%', height:'100%', playerVars:{playsinline:1, rel:0, controls:0, origin:location.origin},
    events:{onReady:function(){ pronto[i] = true; anuncia(); }, onStateChange:function(ev){ env({t:'ev', i:i, data:ev.data}); }, onError:function(ev){ env({t:'err', i:i, data:ev.data}); }}}); }); };
  var sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.onerror = function(){ document.getElementById('ov-msg').textContent = 'Não consegui carregar o player do YouTube. Confira a internet.'; }; document.head.append(sc);
  function anuncia(){ env({t:'pronto', yt:pronto.slice(), som:liberado}); }
  setInterval(anuncia, 2000);
  setInterval(function(){
    if (!pronto[0] && !pronto[1] && !pronto[2]) return;
    var st = [], tm = [], du = [];
    for (var i = 0; i < 3; i++) { var p = P[i], a = -1, b = 0, d = 0; try { if (p && pronto[i]) { a = p.getPlayerState(); b = p.getCurrentTime(); d = p.getDuration(); } } catch(e){} st.push(a); tm.push(b); du.push(d); }
    env({t:'tel', st:st, tm:tm, du:du});
  }, 400);
  /* liberar o som (um clique) */
  document.getElementById('ligaSom').onclick = function(){
    liberado = true; ov.hidden = true; try { AU.efeito('__libera'); } catch(e){}
    try { var a = new Audio(); a.muted = true; a.play().catch(function(){}); } catch(e){}
    anuncia();
  };
  /* iniciativa e "tocando agora" */
  var pub = document.getElementById('pub'), pubTopo = document.getElementById('pubTopo'), pubIni = document.getElementById('pubIni'), np = document.getElementById('pubNp');
  function mostraPub(m){
    var ini = Array.isArray(m.ini) ? m.ini : [];
    pub.classList.toggle('vis', ini.length > 0); pubTopo.textContent = ini.length ? 'Volta ' + m.volta + ' · Rodada ' + m.rod : '';
    pubIni.replaceChildren.apply(pubIni, ini.map(function(x){ var li = document.createElement('li'); li.textContent = x.n; if (x.i) li.classList.add('inim'); if (x.a) li.classList.add('ativo'); return li; }));
    np.textContent = m.np || ''; np.classList.toggle('vis', !!m.np);
  }
  bc.onmessage = function(ev){
    var m = ev.data; if (!m) return;
    if (m.t === 'oi') { anuncia(); }
    else if (m.t === 'yt') { var p = P[m.i]; if (p && pronto[m.i] && typeof p[m.m] === 'function') { try { p[m.m].apply(p, m.a || []); } catch(e){} } }
    else if (m.t === 'au') { if (SOM[m.m]) { try { SOM[m.m].apply(null, m.a || []); } catch(e){} } }
    else if (m.t === 'pub') mostraPub(m);
  };
  anuncia();
})();
</script>
</body>
</html>
