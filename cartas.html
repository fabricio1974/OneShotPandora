<style>

.cf.ab .tt{left:30%;width:58.7%}

.dica{color:var(--apagado);font-size:14px;margin:8px 0 0}

.topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}

.abas{display:flex;gap:6px;margin:6px 0 10px}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}

.bola.sem{background:#0d0a08;box-shadow:0 0 0 2px var(--terra);border:2px dashed var(--terra2)}

.leg .bal .sd{grid-column:1/-1}.leg .bal .sd i{background:#0d0a08;border:2px dashed var(--terra2)}
.leg>button{border-radius:999px;min-height:40px;padding:4px 12px;font-size:14px;background:#1d140e;border-color:var(--terra);font-weight:600;box-shadow:0 4px 14px #000c}
.leg[hidden]{display:none}
.eu{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.ferr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.ferr input[type=range]{flex:1;min-width:120px;accent-color:var(--terra)}
.bolinha{display:inline-block;width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 75% 58%);margin-right:6px;vertical-align:-1px}
.mo .corpo.ver{align-items:flex-start}.mo .zoomc{width:calc(min(88vw,420px) * var(--z,1));max-width:none;flex:none;margin-inline:auto}.mo .nav2{padding:8px max(10px,env(safe-area-inset-left,0px));background:#120d0a;border-bottom:1px solid var(--linha)}
.mo .zoomc .cf{box-shadow:0 2px 14px #000c}
.mo .nav2{display:flex;gap:8px;align-items:center;justify-content:center}
.mo .nav2 input[type=range]{flex:1;max-width:220px;min-width:0;accent-color:var(--terra)}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.toast{bottom:auto!important;top:calc(12px + env(safe-area-inset-top,0px))}
.mo .corpo{display:flex;flex-direction:column;align-items:center;gap:14px}
.mo .virar{width:min(86vw,400px,calc((100dvh - 230px) * 720 / 964));cursor:pointer}
.mo .dica{text-align:center;margin:0}.ctl{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.donos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92vw,440px)}
.donos button{min-height:50px;font-weight:600;border-width:2px;border-color:hsl(var(--h) 55% 45%)}
.donos button[aria-pressed="true"]{background:hsl(var(--h) 70% 62%);border-color:hsl(var(--h) 70% 62%);color:#1a0c04}
.sec{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.maoh{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.maoh h2{margin:0}
.vazio{color:var(--apagado);text-align:center;padding:28px 0}
.reiniciar{margin-top:26px;text-align:center}

.cf .tt{justify-content:safe center}

function desReg(){
  const sec = (t, ...itens) => el('div', {class:'reg'}, el('h2', {}, t), el('ul', {}, ...itens.map(x => { const li = el('li'); li.innerHTML = x; return li; })));
  $('sReg').replaceChildren(
    sec('As cartas',
      'A partir da volta 2, a cada volta cada jogador puxa <b>2 cartas</b>. O grupo <b>distribui como quiser</b>: um pode ficar com várias e outro com nenhuma.',
      'As cartas ficam com vocês nas voltas seguintes.',
      '<b>Por luta:</b> recarrega no começo de cada luta. <b>Por volta:</b> recarrega quando uma pétala é arrancada. <b>Recarga 5–6:</b> depois de usar, role 1d6 no início dos seus turnos; a carta volta com 5 ou 6.',
      '<b>CD do cavaleiro:</b> 15, ou a do seu personagem se for maior. <b>Ataque do cavaleiro:</b> +7, ou o do seu personagem se for maior.',
      '<b>Limite de dados:</b> nenhum efeito rola mais de 6 dados.'),
    sec('Eco da Fome',
      'Cada carta que você tem dá <b>+6 PV máximos</b> e <b>+4 de dano fixo, uma vez por turno</b>, no primeiro acerto ou dano do turno.',
      'Não dobra em crítico e não vale em reações.',
      'Exemplo: com 6 cartas, +36 PV e +24 de dano fixo uma vez por turno.',

}

const ABAS = [['mesa','Mesa','sMesa'], ['maos','Minha mão','sMaos'], ['cav','Cavaleiros','sCav'], ['reg','Regras','sReg']];
function pinta(){
  $('cont').replaceChildren(el('b', {}, reveladas().length), ' de ' + LISTA.length + ' viradas');
  $('abas').replaceChildren(...ABAS.map(([k, t]) => el('button', {'aria-pressed':String(S.aba === k), onclick:() => { S.aba = k; salvar(); pinta(); window.scrollTo(0, 0); }}, t)));
  for (const [k, , id] of ABAS) $(id).hidden = S.aba !== k;
  legenda();
  if (S.aba === 'mesa') desMesa(); else if (S.aba === 'maos') desMaos(); else if (S.aba === 'reg') desReg(); else desCav();
}

/* ---- janela: virar e escolher o dono (Mesa) ---- */
let atual = '';
function abre(){ $('mo').hidden = false; document.body.style.overflow = 'hidden'; }
function abrir(code){ atual = code; modo = 'mesa'; abre(); pintaMo(); const v = $('mo').querySelector('.virar'); v && v.focus(); }
function fecha(){ $('mo').hidden = true; document.body.style.overflow = ''; pinta(); }
let modo = 'mesa';
function vira(){
  if (S.v[atual]) return;
  S.v[atual] = 1; salvar();
  const v = $('mo').querySelector('.virar'); if (v) { v.classList.add('v'); v.setAttribute('aria-label', porCod(atual).n); }
  const top = $('mo').querySelector('.topo2 .esp'); if (top) top.textContent = porCod(atual).n;
  const c = $('ctl'); if (c) c.replaceChildren();
  setTimeout(pintaCtl, 450);
}
function pintaMo(){
  const c = porCod(atual), aberta = !!S.v[atual];
  const frente = cartaFace(c); frente.classList.add('frente');
  const v = el('div', {class:'virar' + (aberta ? ' v' : ''), tabindex:'0', role:'button', 'aria-label':aberta ? c.n : 'Virar a carta ' + atual, onclick:vira, onkeydown:e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); vira(); } }},
    el('div', {class:'in'}, cartaCostas(atual), frente));
  $('mo').replaceChildren(el('div', {class:'topo2'}, el('div', {class:'esp'}, aberta ? c.n : 'Carta ' + atual), el('button', {class:'peq', onclick:fecha}, 'Fechar')),
    el('div', {class:'corpo'}, v, el('div', {id:'ctl', class:'ctl'})));
  pintaCtl();
}
function pintaCtl(){
  const ctl = $('ctl'); if (!ctl) return;
  const aberta = !!S.v[atual], d = donoDe(atual);
  ctl.replaceChildren(
    el('p', {class:'dica'}, !aberta ? 'Toque na carta para virar.' : d ? 'Com ' + d + '. Toque noutro nome para trocar.' : 'Quem fica com ela?'),
    aberta ? el('div', {class:'donos', role:'group', 'aria-label':'Dono da carta'}, ...JOGADORES.map(n => { const b = el('button', {type:'button', 'aria-pressed':String(d === n), onclick:() => dono(n)}, n); b.style.setProperty('--h', matiz(n)); return b; })) : null,
    aberta ? el('div', {class:'sec'}, d ? el('button', {class:'peq', onclick:() => dono('')}, 'Tirar o dono') : null, el('button', {class:'peq perigo', onclick:desvira}, 'Desvirar e devolver ao monte')) : null);
}
function dono(n){ if (n) S.o[atual] = n; else delete S.o[atual]; salvar(); if (n) { dizer(porCod(atual).n + ' ficou com ' + n); fecha(); } else pintaCtl(); }
function desvira(){ delete S.v[atual]; delete S.o[atual]; salvar(); fecha(); dizer('Carta devolvida ao monte'); }

/* ---- janela: ver a própria mão com zoom (Minha mão) ---- */
let vi = 0, zm = 1, V = null;
function ver(i, l, f, t, x){ V = l ? {l, f, t, x} : {l:minhas(), f:cartaFace, t:c => c.n, x:null}; vi = i; zm = 1; modo = 'ver'; abre(); pintaVer(); }
function pintaVer(){
  const l = V.l; if (!l.length) { fecha(); return; }
  vi = (vi + l.length) % l.length; const c = l[vi];
  const z = el('div', {class:'zoomc'}, V.f(c)); z.style.setProperty('--z', zm);
  const passo = d => () => { vi += d; zm = 1; pintaVer(); };
  const muda = d => () => { zm = Math.min(2.6, Math.max(.6, +(zm + d).toFixed(2))); pintaVer(); };
  $('mo').replaceChildren(
    el('div', {class:'topo2'}, el('div', {class:'esp'}, V.t(c)), el('span', {class:'cont'}, (vi + 1) + ' / ' + l.length), el('button', {class:'peq', onclick:fecha}, 'Fechar')),
    el('div', {class:'nav2'}, el('button', {class:'peq', 'aria-label':'Carta anterior', onclick:passo(-1)}, '‹'), el('button', {class:'peq', 'aria-label':'Diminuir', onclick:muda(-.3)}, '−'), el('input', {type:'range', min:.6, max:2.6, step:.1, value:zm, 'aria-label':'Zoom', oninput:e => { zm = +e.target.value; z.style.setProperty('--z', zm); }}), el('button', {class:'peq', 'aria-label':'Aumentar', onclick:muda(.3)}, '+'), el('button', {class:'peq', 'aria-label':'Próxima carta', onclick:passo(1)}, '›')),
    V.x ? el('div', {class:'acao'}, V.x()) : null,
    el('div', {class:'corpo ver'}, z));
}
document.addEventListener('keydown', e => { if ($('mo').hidden) return; if (e.key === 'Escape') fecha(); else if (modo === 'ver' && e.key === 'ArrowRight') { vi++; zm = 1; pintaVer(); } else if (modo === 'ver' && e.key === 'ArrowLeft') { vi--; zm = 1; pintaVer(); } });

/* ---- aba Cavaleiros: cada jogador só vê as cartas da virtude que escolheu ---- */
const VIRTUDES = ['Libertação','Paz','Fartura','Vida'], PAPEIS = ['Combatente','Conjurador','Suporte'];
const norm = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const kPorId = id => KC.find(x => x.id === id);
const kDe = (v, p) => kPorId(norm(v) + '_' + norm(p));
const KTAG = {passiva:['PASSIVA','#2f6b3a'], padrao:['AÇÃO PADRÃO','#8a2a1f'], bonus:['AÇÃO BÔNUS','#b5651d'], livre:['AÇÃO LIVRE','#5b5f68'], reacao:['REAÇÃO','#5a3a86']};
function kFace(k){
  const habs = k.hab.map(h => { const t = KTAG[h.tag] || [h.tag, '#555'], tx = el('span'); tx.innerHTML = h.texto;
    return el('div', {class:'kh'}, el('span', {class:'ktag', style:'background:' + t[1]}, t[0]), h.limite ? el('span', {class:'klim'}, h.limite.toUpperCase()) : null, h.gatilho ? el('i', {class:'kgat'}, h.gatilho + ': ') : null, el('b', {}, h.nome + '. '), tx); });
  const cf = el('div', {class:'cf kc', 'data-c':k.id},
    el('img', {class:'fr', src:'img/cav/' + k.id + '.jpg', alt:'', draggable:'false'}),
    el('div', {class:'ktt'}, k.nome), el('div', {class:'kty'}, k.tipo + (k.papel ? ' ◆ ' + k.papel : '')),
    el('div', {class:'kpn'}, ...habs, k.flavor ? el('div', {class:'kfl'}, k.flavor) : null));
  ro.observe(cf); return cf;
}
function kCostas(rotulo){ return el('div', {class:'cf kb'}, el('img', {class:'fr', src:'img/cav/verso.jpg', alt:'', draggable:'false'}), el('div', {class:'kn'}, rotulo)); }
const pacoteDe = (v, p) => [kDe(v, p), p === 'Conjurador' ? kPorId('coroa_arcana') : p === 'Suporte' ? kPorId('aura_coroa') : null, kPorId('aureola')].filter(Boolean);
const kTit = k => k.nome + (k.papel && !k.base ? ' · ' + k.papel : '');
let pendV = '';
function desCav(){
  const eu = S.ec, minha = VIRTUDES.find(v => S.cav[v] === eu), papel = eu ? S.papel[eu] : '';
  const quem = el('div', {class:'eu', role:'group', 'aria-label':'Quem é você'}, ...JOGADORES.map(n => { const b = el('button', {class:'chip', 'aria-pressed':String(eu === n), onclick:() => { S.ec = n; pendV = ''; salvar(); desCav(); }}); const i = el('span', {class:'bolinha'}); i.style.setProperty('--h', matiz(n)); b.append(i, n); return b; }));
  const partes = [quem];
  if (!eu) partes.push(el('div', {class:'vazio'}, 'Escolha acima quem é você.'));
  else if (!minha) {
    partes.push(el('div', {class:'titc'}, 'A anja oferece'), el('p', {class:'dica', style:'margin:0 0 4px'}, 'Cada virtude só pode ser escolhida por uma pessoa. Só você vai ver as cartas da que escolher.'));
    partes.push(el('div', {class:'ofertas'}, ...VIRTUDES.map(v => { const d = S.cav[v];
      const b = el('button', {class:'slot' + (d ? ' tomada' : ''), type:'button', disabled:!!d, 'aria-label':d ? v + ', já escolhida por ' + d : 'Escolher ' + v, onclick:() => { pendV = v; desCav(); }}, kCostas(v));
      if (d) { const t = el('div', {class:'bola', 'aria-hidden':'true'}); t.style.setProperty('--h', matiz(d)); b.append(t); }
      return b; })));
    if (pendV) partes.push(el('div', {class:'conf', role:'alert'}, el('div', {}, 'Ficar com a virtude ', el('b', {}, pendV), '?'), el('div', {class:'sec'}, el('button', {onclick:() => { S.cav[pendV] = eu; delete S.papel[eu]; pendV = ''; salvar(); dizer('Virtude escolhida'); desCav(); }}, 'Confirmar'), el('button', {onclick:() => { pendV = ''; desCav(); }}, 'Cancelar'))));
  } else {
    const h = el('div', {class:'titc'}, el('span', {class:'bola'}), minha); h.firstChild.style.setProperty('--h', matiz(eu)); partes.push(h);
    if (!papel) {
      partes.push(el('p', {class:'dica', style:'margin:0 0 4px'}, 'Escolha como o seu cavaleiro luta. Toque numa carta para ver e ampliar.'));
      partes.push(el('div', {class:'opcoes'}, ...PAPEIS.map(p => { const k = kDe(minha, p), pc = pacoteDe(minha, p);
        return el('div', {class:'opc'}, el('button', {class:'slot', type:'button', 'aria-label':p + ', ver cartas', onclick:() => ver(0, pc, kFace, kTit, () => el('button', {onclick:() => escolhePapel(p)}, 'Escolher ' + p))}, kFace(k)),
          el('div', {class:'nota'}, p === 'Conjurador' ? '+ Coroa Arcana' : p === 'Suporte' ? '+ Aura da Coroa' : ' '),
          el('button', {class:'escolhe', onclick:() => escolhePapel(p)}, p)); })));
      partes.push(el('p', {class:'dica'}, 'Todo cavaleiro também recebe a Auréola.'), el('div', {class:'pacote'}, el('button', {class:'slot', type:'button', onclick:() => ver(0, [kPorId('aureola')], kFace, kTit)}, kFace(kPorId('aureola')))));
    } else {
      const pc = pacoteDe(minha, papel);
      partes.push(el('div', {class:'maoh'}, el('h2', {}, papel), el('span', {class:'cont'}, pc.length + ' cartas')),
        el('div', {class:'pacote'}, ...pc.map((k, i) => el('button', {class:'slot', type:'button', 'aria-label':kTit(k), onclick:() => ver(i, pc, kFace, kTit)}, kFace(k)))),
        el('div', {class:'sec', style:'justify-content:flex-start'}, el('button', {class:'peq', onclick:() => { delete S.papel[eu]; salvar(); desCav(); }}, 'Trocar de forma'), el('button', {class:'peq perigo', onclick:function(){ if (this.dataset.sim) { delete S.cav[minha]; delete S.papel[eu]; salvar(); desCav(); dizer('Virtude devolvida'); return; } this.dataset.sim = 1; this.textContent = 'Toque de novo para devolver'; }}, 'Devolver a virtude')));
    }
  }
  $('sCav').replaceChildren(...partes);
}
function escolhePapel(p){ S.papel[S.ec] = p; salvar(); dizer('Você escolheu ' + p); if (!$('mo').hidden) { $('mo').hidden = true; document.body.style.overflow = ''; } desCav(); }

$('zera').addEventListener('click', function(){ if (this.dataset.sim) { S.v = {}; S.o = {}; S.cav = {}; S.papel = {}; salvar(); delete this.dataset.sim; this.textContent = 'Desvirar tudo e recomeçar'; pinta(); dizer('Tudo de volta ao monte'); return; } this.dataset.sim = 1; this.textContent = 'Toque de novo para confirmar'; setTimeout(() => { delete this.dataset.sim; this.textContent = 'Desvirar tudo e recomeçar'; }, 3500); });
addEventListener('storage', ev => { if (ev.key !== CHAVE || !ev.newValue) return; try { const j = JSON.parse(ev.newValue); if (j && j.v && j.o) { S.v = j.v; S.o = j.o; S.cav = j.cav || S.cav; S.papel = j.papel || S.papel; if ($('mo').hidden) pinta(); } } catch (e) {} });
pinta();

</script>
