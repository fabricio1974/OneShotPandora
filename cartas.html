<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a08">
<title>Cartas de Poder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Inter:wght@400;600&display=swap">
<style>
:root{--fundo:#0d0a08;--painel:#17110d;--linha:#3a2a1f;--terra:#c8622d;--terra2:#e08a52;--texto:#efe2d0;--apagado:#a8947f;--creme:#f1e7d3;--tinta:#2a1a10;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.45 Inter,system-ui,sans-serif;padding-block:14px calc(76px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
main{max-width:60rem;margin:0 auto}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0;text-wrap:balance}
h1{font-size:28px;letter-spacing:.05em;color:var(--terra2);text-align:center}
h2{font-size:24px;color:var(--terra2)}
h3{font-size:20px;color:var(--terra2);margin-top:16px}
.meandro{height:10px;margin:8px 0 14px;background:repeating-linear-gradient(90deg,var(--terra) 0 10px,transparent 10px 12px) top/100% 3px no-repeat,repeating-linear-gradient(90deg,transparent 0 5px,var(--terra) 5px 7px,transparent 7px 12px) bottom/100% 3px no-repeat;opacity:.8}
button,select,input{font:inherit;color:var(--texto)}
button{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--terra)}
button[aria-pressed="true"],button.on{background:var(--terra);border-color:var(--terra);color:#1a0c04;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button.peq{min-height:34px;padding:4px 10px;font-size:14px}
button.perigo{color:#ee9a86}
select,input[type=text]{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:8px 10px;min-height:40px}
select.peq{min-height:34px;padding:4px 8px;font-size:14px}
:focus-visible{outline:2px solid var(--terra2);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;background:#120d0a;border-top:1px solid var(--linha);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;padding:6px 2px;font-size:13px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.nav .i{font-size:20px;line-height:1}
.nav .b{position:absolute;margin-left:22px;margin-top:-4px;background:var(--terra);color:#1a0c04;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px}
.busca{display:flex;gap:8px}
.busca input{flex:1;min-width:0;font:600 26px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center;border:2px solid var(--linha);border-radius:12px;padding:8px}
.busca input:focus{outline:none;border-color:var(--terra)}
.dica{color:var(--apagado);font-size:14px;margin:8px 0 0}
.erro{color:#ee9a86;margin:8px 0 0;min-height:1.3em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{border:1px solid var(--linha);border-radius:999px;padding:3px 10px;background:var(--painel);font-size:14px;min-height:32px;color:var(--texto)}
.sub{color:var(--apagado);font-size:14px}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.painel{border:1px solid var(--linha);border-radius:12px;padding:12px 14px;background:var(--painel);margin:10px 0}
.painel b{color:var(--terra2)}
.vazio{color:var(--apagado);text-align:center;padding:28px 0}
.aviso{background:#2a1a10;border:1px solid var(--terra);border-radius:12px;padding:12px;margin:10px 0}
/* ---- a carta ---- */
.cf{position:relative;aspect-ratio:720/964;container-type:inline-size;background:#000;border-radius:3.2cqw;overflow:hidden;color:var(--tinta);user-select:none;-webkit-user-select:none}
.cf>*{position:absolute}
.cf .fr{inset:0;width:100%;height:100%;display:block}
.cf .art{left:11.7%;top:18%;width:76.6%;height:40.3%;object-fit:cover;display:block}
.cf .tt{left:11.7%;top:9.9%;width:77%;height:6.4%;display:flex;align-items:center;justify-content:center;font:700 5.6cqw 'Cormorant Garamond',Georgia,serif;white-space:nowrap;letter-spacing:.02em;overflow:hidden;text-transform:uppercase}
.cf .cd{left:84%;top:1.8%;width:13.2%;height:9.8%;display:flex;align-items:center;justify-content:center;font:700 4.2cqw Inter,sans-serif;letter-spacing:.02em;border-radius:50%}
.cf .pn{left:11.7%;top:60.6%;width:76.8%;height:25.2%;padding:1.8cqw 2.4cqw;overflow:hidden;display:flex;flex-direction:column;font:500 4.4cqw/1.22 'Cormorant Garamond',Georgia,serif}
.cf .us{font:600 .68em Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#8a3d17;margin-bottom:.25em}
.cf .ef{font-weight:700;flex:1}
.cf .fg{font-style:italic;text-align:center;border-top:1px solid #c9b89a;margin-top:.3em;padding-top:.25em;font-weight:700;color:#5a3a22}
.cf .ft{left:11.7%;top:87.9%;width:77%;height:3.6%;display:flex;align-items:center;justify-content:center;font:600 2.7cqw Inter,sans-serif;letter-spacing:.04em;color:#6a4a2a;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.cf .ic{left:13.5%;top:50.3%;width:8%;opacity:.95}
.cf .tg{right:13.5%;top:51%;background:#f4efe6;color:#1a1612;font:700 2.6cqw Inter,sans-serif;letter-spacing:.1em;padding:.4cqw 2cqw;border-radius:99px}
.cf.ab .tt{left:30%;width:58.7%}
.cf.ab .cd{left:2.5%;top:1.8%;width:13.2%}
.cf.ab .ic{display:none}
.cf.costas .cd{left:34%;top:39%;width:32%;height:23%;font:700 11cqw 'Cormorant Garamond',Georgia,serif;color:#3a2010}
.cf.costas .cd small{display:none}
.cf.costas .lis{left:36%;top:41%;width:28%;opacity:.15}
.carta-grande{width:min(86vw,360px);margin:14px auto}
.virar{perspective:1200px}
.virar .in{position:relative;transition:transform .8s;transform-style:preserve-3d;aspect-ratio:720/964}
.virar .in>.cf{position:absolute;inset:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.virar .in>.cf.costas{transform:rotateY(0)}
.virar .in>.cf.frente{transform:rotateY(180deg)}
.virar.v .in{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.virar .in{transition:none}}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:6px}
.item .cf{cursor:pointer;box-shadow:0 2px 10px #000a}
.item .ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.item .ctl select{flex:1;min-width:0}
.pontos{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:30px}
.ponto{width:24px;height:24px;border-radius:50%;border:2px solid var(--terra);background:var(--terra);padding:0;min-height:0}
.ponto.gasto{background:transparent}
.est{font-size:12px;color:var(--apagado)}
.lista .li{display:flex;gap:10px;align-items:center;border:1px solid var(--linha);background:var(--painel);border-radius:10px;padding:6px 10px;margin-bottom:6px}
.lista .li .cd{font-weight:700;color:var(--terra2);min-width:3em}
.lista .li .nm{flex:1;min-width:0}
.fila{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.fila .cf{flex:0 0 120px;cursor:pointer;scroll-snap-align:start}
.mesa .quem{display:flex;gap:8px;align-items:baseline;margin:14px 0 6px;flex-wrap:wrap}
.hands{display:flex;gap:6px;flex-wrap:wrap}
.hands .chip{display:flex;gap:6px;align-items:center;min-height:38px;cursor:pointer}
.hands .chip.at{background:var(--terra);border-color:var(--terra);color:#1a0c04;font-weight:600}
.inimigos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ini{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:var(--painel);cursor:pointer;text-align:left;padding:0}
.ini img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.ini .n{padding:8px 10px}.ini .n b{display:block;font:700 19px 'Cormorant Garamond',Georgia,serif;color:var(--terra2)}
/* ---- janela de zoom e regra ---- */
.mo{position:fixed;inset:0;z-index:50;background:#0d0a08;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mo[hidden]{display:none}
.mo .topo{display:flex;gap:6px;align-items:center;padding:8px max(10px,env(safe-area-inset-left,0px));background:#120d0a;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.mo .topo .esp{flex:1}
.mo .topo input[type=range]{width:110px;accent-color:var(--terra)}
.mo .corpo{flex:1;overflow:auto;padding:12px max(12px,env(safe-area-inset-left,0px)) 30px;-webkit-overflow-scrolling:touch}
.mo .zoom{width:calc(min(88vw,460px) * var(--z,1));margin:0 auto}
.mo .reg{max-width:34rem;margin:14px auto 0}
.mo .reg p{margin:6px 0}
.mo .reg .grande{font-size:18px}
.mo .reg .frase{font:italic 700 22px 'Cormorant Garamond',Georgia,serif;text-align:center;color:var(--terra2);margin:14px 0 4px}
.mo .reg ul{margin:6px 0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a1a10;border:1px solid var(--terra);border-radius:999px;padding:8px 16px;z-index:60;max-width:90vw;text-align:center;font-size:14px}
.tab{width:100%;border-collapse:collapse;font-size:14px}.tab td,.tab th{border:1px solid var(--linha);padding:6px;vertical-align:top;text-align:left}
.rol{overflow-x:auto}
.copia{display:flex;gap:8px}.copia input{flex:1;min-width:0}
a{color:var(--terra2)}
</style>
</head>
<body>
<main>
<h1>Cartas de Poder</h1>
<div class="meandro" aria-hidden="true"></div>
<section id="sPux"></section>
<section id="sMao" hidden></section>
<section id="sTod" hidden></section>
<section id="sIni" hidden></section>
<section id="sReg" hidden></section>
<section id="sMes" hidden></section>
</main>
<nav class="nav" id="nav" aria-label="Seções"></nav>
<div class="mo" id="mo" hidden role="dialog" aria-modal="true" aria-label="Carta"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
const CARTAS = [{"c": "S01", "n": "Pele de Lobo", "o": "Esaú", "u": "Passiva", "t": false, "e": "Resistência a dano perfurante e cortante. +2 na CA contra ataques à distância.", "f": "Lobo é o homem"}, {"c": "S02", "n": "Segundo Fôlego do Tambor", "o": "Jael", "u": "Ação livre · 2/luta · gatilho: você fica abaixo de metade dos PV", "t": false, "e": "Recupera 6d10 + 10 (43) PV.", "f": "a outros, livres."}, {"c": "S03", "n": "Milagre Menor", "o": "Hildegarda", "u": "Reação · 1/luta · gatilho: você cai a 0 PV", "t": false, "e": "Fica com 1 PV e recupera 50 PV.", "f": "Não vos esqueçais"}, {"c": "S04", "n": "Escudo de Torre", "o": "Raquel", "u": "Passiva e Reação", "t": false, "e": "+3 na CA. [Reação] Vira o alvo de um ataque contra um aliado a até 1,5 m.", "f": "A vida só pode ser compreendida"}, {"c": "S05", "n": "Já Vi Esse Golpe", "o": "Ezequiel", "u": "Reação · 3/luta", "t": false, "e": "+5 na CA contra um ataque.", "f": "Quem combate monstros"}, {"c": "S06", "n": "Campo de Massa", "o": "Ozymandias", "u": "Passiva", "t": false, "e": "Ataques à distância contra você têm desvantagem.", "f": "Meu nome é Ozymandias,"}, {"c": "S07", "n": "Spiritus", "o": "Hildegarda", "u": "Passiva", "t": false, "e": "No início do seu turno, se tiver pelo menos 1 PV, recupera 15 PV.", "f": "da hospitalidade,"}, {"c": "S08", "n": "Um Segundo a Mais", "o": "Chronos", "u": "Reação · 2/luta", "t": false, "e": "Um ataque que acertaria você erra.", "f": "O que foi, será; o que se fez, se fará:"}, {"c": "S09", "n": "Muralha", "o": "Jael", "u": "Passiva", "t": false, "e": "+20 PV máximos. Não pode ser derrubado, empurrado nem puxado. O dano contundente que você sofre cai pela metade.", "f": "e rei de todas;"}, {"c": "S10", "n": "Couraça Branca", "o": "Mical, a Tecelã", "u": "Ação bônus · 1/volta", "t": true, "e": "Por 1 minuto, todo dano que você sofre é reduzido em 10. Tinta: apaga uma condição sua.", "f": "Suponhamos que a mente seja"}, {"c": "S11", "n": "Pão Dividido", "o": "Boaz, o Padeiro", "u": "Ação padrão · 1/luta", "t": false, "e": "Você e os aliados a até 9 m ganham 30 PV temporários.", "f": "um papel em branco,"}, {"c": "S12", "n": "Corpo de Planeta", "o": "Ozymandias", "u": "Passiva", "t": false, "e": "+50 PV máximos.", "f": "rei dos reis:"}, {"c": "A01", "n": "Arpão de Corrente", "o": "Esaú", "u": "Ação bônus · 2/luta", "t": false, "e": "Ataque à distância de 18 m: 4d10 + 4 (26) perfurante. Se acertar, o alvo fica impedido até o fim do seu próximo turno, sem salvaguarda.", "f": "para o homem,"}, {"c": "A02", "n": "Estaca", "o": "Jael", "u": "Ação livre · 1/turno · ao acertar", "t": false, "e": "+3d8 (13) perfurante, e o alvo fica cravado até o início do seu próximo turno: deslocamento 0, sem reações, sem teletransporte. Sem salvaguarda.", "f": "a outros, homens;"}, {"c": "A03", "n": "Martelo Ressoante", "o": "Jael", "u": "Passiva", "t": false, "e": "Seus golpes corpo a corpo causam +3d8 (13), e todo o dano deles vira trovejante.", "f": "a uns fez deuses,"}, {"c": "A04", "n": "Marca do Caçador", "o": "Esaú", "u": "Ação bônus", "t": false, "e": "Marque uma criatura. Seus acertos nela causam +4d6 (14) e ignoram resistências e cobertura.", "f": "quem"}, {"c": "A05", "n": "Flecha de Ferro", "o": "Esaú", "u": "Passiva", "t": false, "e": "Seus ataques à distância causam +3d6 (10), todo o dano deles vira perfurante, e o crítico acontece com 18, 19 ou 20.", "f": "e não homem,"}, {"c": "A06", "n": "Lança de Falange", "o": "Raquel", "u": "Passiva", "t": false, "e": "+1,5 m de alcance e +3d6 (10) nos golpes corpo a corpo.", "f": "olhando para trás,"}, {"c": "A07", "n": "Golpe de Escudo", "o": "Raquel", "u": "Ação bônus · 1/rodada", "t": false, "e": "Uma criatura a até 1,5 m é empurrada 3 m e cai derrubada, sem salvaguarda. Seu próximo golpe corpo a corpo nesta rodada causa +3d6 (10) e tem vantagem.", "f": "mas só pode ser vivida"}, {"c": "A08", "n": "Mão de Órbita", "o": "Ozymandias", "u": "Passiva", "t": false, "e": "Seus golpes corpo a corpo causam +3d function desMestre(){
  const r = $('sMes'); r.replaceChildren(); r.hidden = false; $('nav').hidden = true; for (const id of ['sPux','sMao','sTod','sIni','sReg']) $(id).hidden = true;
  r.append(el('h2', {}, 'Mestre: todas as cartas'), el('p', {class:'sub'}, 'Esta página mostra as frases completas e todas as cartas. Não mostre aos jogadores. Para sair, tire #mestre do endereço.'),

/* ---- navegação ---- */
const ABAS = [['pux','🎴','Puxar','sPux'], ['mao','🖐','Mãos','sMao'], ['tod','📖','Todas','sTod'], ['ini','🗡','Inimigos','sIni'], ['reg','📜','Regras','sReg']];
function mudaAba(a){ S.aba = a; salvar(); for (const [k, , , id] of ABAS) $(id).hidden = k !== a; desenhaNav(); if (a === 'pux') desPux(); if (a === 'mao') desMao(); if (a === 'tod') desTod(); if (a === 'ini') desIni(); if (a === 'reg') desReg(); window.scrollTo(0, 0); }
function desenhaNav(){ $('nav').replaceChildren(...ABAS.map(([k, ic, t]) => el('button', {'aria-pressed':String(S.aba === k), onclick:() => mudaAba(k)}, el('span', {class:'i'}, ic), t, k === 'mao' && maoAtiva().cartas.length ? el('span', {class:'b'}, String(maoAtiva().cartas.length)) : null))); }
function redesenhaTudo(){ desenhaNav(); if (S.aba === 'pux') desPux(); if (S.aba === 'mao') desMao(); if (S.aba === 'tod') desTod(); }
if (MESTRE) desMestre(); else { importaDoLink(); mudaAba(S.aba in {pux:1, mao:1, tod:1, ini:1, reg:1} ? S.aba : 'pux'); }
