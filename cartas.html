<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a08">
<title>Cartas de Poder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--fundo:#0d0a08;--painel:#17110d;--linha:#3a2a1f;--terra:#c8622d;--terra2:#e08a52;--texto:#efe2d0;--apagado:#a8947f;--creme:#f1e7d3;--tinta:#2a1a10;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.45 Inter,system-ui,sans-serif;padding-block:14px calc(76px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
main{max-width:60rem;margin:0 auto}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0;text-wrap:balance}
h1{font-size:28px;letter-spacing:.05em;color:var(--terra2);text-align:center}
h2{font-size:24px;color:var(--terra2)}
h3{font-size:20px;color:var(--terra2);margin-top:16px}
.meandro{height:10px;margin:8px 0 14px;background:repeating-linear-gradient(90deg,var(--terra) 0 10px,transparent 10px 12px) top/100% 3px no-repeat,repeating-linear-gradient(90deg,transparent 0 5px,var(--terra) 5px 7px,transparent 7px 12px) bottom/100% 3px no-repeat;opacity:.8}
button,select,input{font:inherit;color:var(--texto)}
button{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--terra)}
button[aria-pressed="true"],button.on{background:var(--terra);border-color:var(--terra);color:#1a0c04;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button.peq{min-height:34px;padding:4px 10px;font-size:14px}
button.perigo{color:#ee9a86}
select,input[type=text]{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:8px 10px;min-height:40px}
select.peq{min-height:34px;padding:4px 8px;font-size:14px}
:focus-visible{outline:2px solid var(--terra2);outline-offset:2px}
/* ---- a carta ---- */
.cf{position:relative;aspect-ratio:720/964;container-type:inline-size;background:#000;border-radius:0;overflow:hidden;color:var(--tinta);user-select:none;-webkit-user-select:none}
.cf>*{position:absolute}
.cf .fr{inset:0;width:100%;height:100%;display:block}
.cf .art{left:11.7%;top:18%;width:76.6%;height:40.3%;object-fit:cover;display:block}
.cf .tt{left:11.7%;top:9.9%;width:77%;height:6.4%;display:flex;align-items:center;justify-content:center;font:700 5.6cqw 'Cormorant Garamond',Georgia,serif;white-space:nowrap;letter-spacing:.02em;overflow:hidden;text-transform:uppercase}
.cf .cd{left:84%;top:1.8%;width:13.2%;height:9.8%;display:flex;align-items:center;justify-content:center;font:700 4.2cqw Inter,sans-serif;letter-spacing:.02em;border-radius:50%}
.cf .pn{left:11.7%;top:60.6%;width:76.8%;height:25.2%;padding:1.8cqw 2.4cqw;overflow:hidden;display:flex;flex-direction:column;font:500 4.4cqw/1.22 'Cormorant Garamond',Georgia,serif}
.cf .us{font:600 .68em Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#8a3d17;margin-bottom:.25em}
.cf .ef{font-weight:700;flex:1}
.cf .fg{font-style:italic;text-align:center;border-top:1px solid #c9b89a;margin-top:.3em;padding-top:.25em;font-weight:700;color:#5a3a22}
.cf .ft{left:11.7%;top:87.9%;width:77%;height:3.6%;display:flex;align-items:center;justify-content:center;font:600 2.7cqw Inter,sans-serif;letter-spacing:.04em;color:#6a4a2a;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.cf .ic{left:13.5%;top:50.3%;width:8%;opacity:.95}
.cf .tg{right:13.5%;top:51%;background:#f4efe6;color:#1a1612;font:700 2.6cqw Inter,sans-serif;letter-spacing:.1em;padding:.4cqw 2cqw;border-radius:99px}
.cf.ab .tt{left:30%;width:58.7%}
.cf.ab .cd{left:2.5%;top:1.8%;width:13.2%}
.cf.ab .ic{display:none}
.cf.costas .cd{left:34%;top:39%;width:32%;height:23%;font:700 11cqw 'Cormorant Garamond',Georgia,serif;color:#3a2010}
.cf.costas .cd small{display:none}
.cf.costas .lis{left:36%;top:41%;width:28%;opacity:.15}
.carta-grande{width:min(86vw,360px);margin:14px auto}
.virar{perspective:1200px}
.virar .in{position:relative;transition:transform .8s;transform-style:preserve-3d;aspect-ratio:720/964}
.virar .in>.cf{position:absolute;inset:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.virar .in>.cf.costas{transform:rotateY(0)}
.virar .in>.cf.frente{transform:rotateY(180deg)}
.virar.v .in{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.virar .in{transition:none}}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.acoes.fixa{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:15;background:#120d0af2;padding:8px;border:1px solid var(--linha);border-radius:12px;box-shadow:0 -6px 14px #000a}
.guard{margin:10px 0 0;font-size:15px}.guard button{margin-left:6px}
.tagq{font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:999px;border:1px solid var(--terra);color:var(--terra);margin-left:6px;vertical-align:middle}.tagq.rec{border-color:#7fb3d9;color:#9cc7ea}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:6px}
.item .cf{cursor:pointer;box-shadow:0 2px 10px #000a}
.item .ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.item .ctl select{flex:1;min-width:0}
.pontos{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:30px}
.ponto{width:24px;height:24px;border-radius:50%;border:2px solid var(--terra);background:var(--terra);padding:0;min-height:0}
.ponto.gasto{background:transparent}
.est{font-size:12px;color:var(--apagado)}
.lista .li{display:flex;gap:10px;align-items:center;border:1px solid var(--linha);background:var(--painel);border-radius:10px;padding:6px 10px;margin-bottom:6px}
.lista .li .cd{font-weight:700;color:var(--terra2);min-width:3em}
.lista .li .nm{flex:1;min-width:0}
.fila{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.fila .cf{flex:0 0 120px;cursor:pointer;scroll-snap-align:start}
.mesa .quem{display:flex;gap:8px;align-items:baseline;margin:14px 0 6px;flex-wrap:wrap}
.hands{display:flex;gap:6px;flex-wrap:wrap}
.hands .chip{display:flex;gap:6px;align-items:center;min-height:38px;cursor:pointer}
.hands .chip.at{background:var(--terra);border-color:var(--terra);color:#1a0c04;font-weight:600}
.inimigos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ini{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:var(--painel);cursor:pointer;text-align:left;padding:0}
.ini img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.ini .n{padding:8px 10px}.ini .n b{display:block;font:700 19px 'Cormorant Garamond',Georgia,serif;color:var(--terra2)}
.mo{position:fixed;inset:0;z-index:50;background:#0d0a08;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mo[hidden]{display:none}
.mo .topo2{display:flex;gap:6px;align-items:center;padding:8px max(10px,env(safe-area-inset-left,0px));background:#120d0a;border-bottom:1px solid var(--linha)}
.mo .topo2 .esp{flex:1;font:700 20px 'Cormorant Garamond',Georgia,serif;color:var(--terra2)}
.mo .corpo{flex:1;overflow:auto;padding:14px max(12px,env(safe-area-inset-left,0px)) 28px;-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a1a10;border:1px solid var(--terra);border-radius:999px;padding:8px 16px;z-index:60;max-width:90vw;text-align:center;font-size:14px}
.dica{color:var(--apagado);font-size:14px;margin:8px 0 0}

.topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cont{color:var(--apagado);font-size:15px}.cont b{color:var(--terra2);font-size:20px}
.abas{display:flex;gap:6px;margin:6px 0 10px}
.abas button{flex:1;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--linha);border-radius:999px;padding:3px 12px;background:var(--painel);font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:#1a0c04;font-weight:600}
.chip small{opacity:.75;margin-left:4px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.slot{position:relative;padding:0;border:0;background:none;min-height:0;border-radius:0;display:block;text-align:left}
.slot .cf{box-shadow:0 2px 10px #000a;pointer-events:none}
.slot:hover .cf{box-shadow:0 0 0 2px var(--terra),0 2px 10px #000a}
.slot.fechada .cf{filter:brightness(.92)}
.bola{position:absolute;right:7px;bottom:7px;width:26px;height:26px;border-radius:50%;background:hsl(var(--h) 75% 58%);border:3px solid #0d0a08;box-shadow:0 0 0 2px hsl(var(--h) 75% 58%),0 2px 6px #000c}
.bola.sem{background:#0d0a08;box-shadow:0 0 0 2px var(--terra);border:2px dashed var(--terra2)}
.leg{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.leg .bal{background:#1d140e;border:1px solid var(--terra);border-radius:14px;padding:8px 10px;box-shadow:0 6px 18px #000d;display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.leg .bal div{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.1}
.leg .bal i{width:13px;height:13px;border-radius:50%;flex:none;background:hsl(var(--h) 75% 58%)}
.leg .bal .sd{grid-column:1/-1}.leg .bal .sd i{background:#0d0a08;border:2px dashed var(--terra2)}
.leg>button{border-radius:999px;min-height:40px;padding:4px 12px;font-size:14px;background:#1d140e;border-color:var(--terra);font-weight:600;box-shadow:0 4px 14px #000c}
.leg[hidden]{display:none}
.eu{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.ferr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.ferr input[type=range]{flex:1;min-width:120px;accent-color:var(--terra)}
.bolinha{display:inline-block;width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 75% 58%);margin-right:6px;vertical-align:-1px}
.mo .corpo.ver{align-items:flex-start}.mo .zoomc{width:calc(min(88vw,420px) * var(--z,1));max-width:none;flex:none;margin-inline:auto}.mo .nav2{padding:8px max(10px,env(safe-area-inset-left,0px));background:#120d0a;border-bottom:1px solid var(--linha)}
.mo .zoomc .cf{box-shadow:0 2px 14px #000c}
.mo .nav2{display:flex;gap:8px;align-items:center;justify-content:center}
.mo .nav2 input[type=range]{flex:1;max-width:220px;min-width:0;accent-color:var(--terra)}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.toast{bottom:auto!important;top:calc(12px + env(safe-area-inset-top,0px))}
.mo .corpo{display:flex;flex-direction:column;align-items:center;gap:14px}
.mo .virar{width:min(86vw,400px,calc((100dvh - 230px) * 720 / 964));cursor:pointer}
.mo .dica{text-align:center;margin:0}.ctl{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.donos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92vw,440px)}
.donos button{min-height:50px;font-weight:600;border-width:2px;border-color:hsl(var(--h) 55% 45%)}
.donos button[aria-pressed="true"]{background:hsl(var(--h) 70% 62%);border-color:hsl(var(--h) 70% 62%);color:#1a0c04}
.sec{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.maoh{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.maoh h2{margin:0}
.vazio{color:var(--apagado);text-align:center;padding:28px 0}
.reiniciar{margin-top:26px;text-align:center}

html{-webkit-tap-highlight-color:transparent}
button,input,a,.cf,.chip{touch-action:manipulation}
button:active,.chip:active{filter:brightness(1.3);transform:scale(.97)}
.cf .tt{justify-content:safe center}
</style>
</head>
<body>
<main>
<div class="topo"><h1 style="text-align:left">Cartas de Poder</h1><div class="cont" id="cont"></div></div>
<div class="meandro" aria-hidden="true"></div>
<div class="abas" id="abas"></div>
<section id="sMesa"></section>
<section id="sMaos" hidden></section>
<div class="leg" id="leg"></div>
<div class="reiniciar"><button class="peq perigo" id="zera" type="button">Desvirar tudo e recomeçar</button></div>
</main>
<div class="mo" id="mo" hidden role="dialog" aria-modal="true" aria-label="Carta"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
const CARTAS = [{"c": "S01", "n": "Pele de Lobo", "o": "Esaú", "u": "Passiva", "t": false, "e": "Resistência a dano perfurante e cortante. +2 na CA contra ataques à distância.", "f": "Lobo é o homem"}, {"c": "S02", "n": "Segundo Fôlego do Tambor", "o": "Jael", "u": "Ação livre · 2/luta · gatilho: você fica abaixo de metade dos PV", "t": false, "e": "Recupera 6d10 + 10 (43) PV.", "f": "a outros, livres."}, {"c": "S03", "n": "Milagre Menor", "o": "Hildegarda", "u": "Reação · 1/luta · gatilho: você cai a 0 PV", "t": false, "e": "Fica com 1 PV e recupera 50 PV.", "f": "Não vos esqueçais"}, {"c": "S04", "n": "Escudo de Torre", "o": "Raquel", "u": "Passiva e Reação", "t": false, "e": "+3 na CA. [Reação] Vira o alvo de um ataque contra um aliado a até 1,5 m.", "f": "A vida só pode ser compreendida"}, {"c": "S05", "n": "Já Vi Esse Golpe", "o": "Ezequiel", "u": "Reação · 3/luta", "t": false, "e": "+5 na CA contra um ataque.", "f": "Quem combate monstros"}, {"c": "S06", "n": "Campo de Massa", "o": "Ozymandias", "u": "Passiva", "t": false, "e": "Ataques à distância contra você têm desvantagem.", "f": "Meu nome é Ozymandias,"}, {"c": "S07", "n": "Spiritus", "o": "Hildegarda", "u": "Passiva", "t": false, "e": "No início do seu turno, se tiver pelo menos 1 PV, recupera 15 PV.", "f": "da hospitalidade,"}, {"c": "S08", "n": "Um Segundo a Mais", "o": "Chronos", "u": "Reação · 2/luta", "t": false, "e": "Um ataque que acertaria você erra.", "f": "O que foi, será; o que se fez, se fará:"}, {"c": "S09", "n": "Muralha", "o": "Jael", "u": "Passiva", "t": false, "e": "+20 PV máximos. Não pode ser derrubado, empurrado nem puxado. O dano contundente que você sofre cai pela metade.", "f": "e rei de todas;"}, {"c": "S10", "n": "Couraça Branca", "o": "Mical, a Tecelã", "u": "Ação bônus · 1/volta", "t": true, "e": "Por 1 minuto, todo dano que você sofre é reduzido em 10. Tinta: apaga uma condição sua.", "f": "Suponhamos que a mente seja"}, {"c": "S11", "n": "Pão Dividido", "o": "Boaz, o Padeiro" 8 (13), todo o dano deles vira energia, e eles puxam o alvo 3 m.", "f": "contemplai minhas obras,"}, {"c": "A09", "n": "Pedra Orbital", "o": "Ozymandias", "u": "Ação padrão · à vontade", "t": false, "e": "Ataque à distância de 36 m: 6d10 + 3 (36) contundente. O alvo cai derrubado.", "f": "ó poderosos,"}, {"c": "A10", "n": "Golpe Visto", "o": "Ezequiel", "u": "Ação livre · 3/luta · antes de rolar um ataque", "t": false, "e": "O ataque acerta e é crítico.", "f": "deve cuidar"}, {"c": "A11", "n": "Ataque Faminto", "o": "Abner, o Açougueiro", "u": "Passiva", "t": true, "e": "Um ataque a mais na ação de Ataque. Tinta: quem você mata é apagado, e você recupera 15 PV.", "f": "vazio de todos os caracteres,"}, {"c": "A12", "n": "Maça Sagrada", "o": "Hildegarda", "u": "Passiva · 1/turno", "t": false, "e": "Um acerto corpo a corpo causa +4d8 (18) radiante.", "f": "pois por ela"}, {"c": "M01", "n": "Presságio", "o": "Ezequiel", "u": "Passiva", "t": false, "e": "No início de cada luta, role 3d20 e guarde. Troque qualquer rolagem sua ou de um inimigo visível por um desses dados. Cada dado vale uma vez.", "f": "para não se tornar"}, {"c": "M02", "n": "Contramágica Vista", "o": "Ezequiel", "u": "Reação · 2/luta", "t": false, "e": "Uma magia ou ação de recarga de um inimigo a até 18 m falha.", "f": "também um monstro."}, {"c": "M03", "n": "Raio Sagrado", "o": "Hildegarda", "u": "Ação bônus · 1/rodada", "t": false, "e": "Ataque mágico de 36 m: 6d8 (27) radiante.", "f": "alguns,"}, {"c": "M04", "n": "Palavra Curativa Máxima", "o": "Hildegarda", "u": "Ação bônus · 1/rodada", "t": false, "e": "Um aliado a até 18 m recupera 40 PV.", "f": "sem o saberem,"}, {"c": "M05", "n": "Inverter", "o": "Ozymandias", "u": "Ação bônus · Recarga 5–6", "t": false, "e": "A gravidade vira numa esfera de 6 m a até 36 m: 6d6 (21) contundente e derrubado, sem salvaguarda.", "f": "e desesperai!"}, {"c": "M06", "n": "Peso da Conta", "o": "Ozymandias", "u": "Ação padrão · Recarga 5–6", "t": false, "e": "Esfera   const c = porCod(atual), aberta = !!S.v[atual];
  const frente = cartaFace(c); frente.classList.add('frente');
  const v = el('div', {class:'virar' + (aberta ? ' v' : ''), tabindex:'0', role:'button', 'aria-label':aberta ? c.n : 'Virar a carta ' + atual, onclick:vira, onkeydown:e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); vira(); } }},
    el('div', {class:'in'}, cartaCostas(atual), frente));
  $('mo').replaceChildren(el('div', {class:'topo2'}, el('div', {class:'esp'}, aberta ? c.n : 'Carta ' + atual), el('button', {class:'peq', onclick:fecha}, 'Fechar')),
    el('div', {class:'corpo'}, v, el('div', {id:'ctl', class:'ctl'})));
  pintaCtl();
}
function pintaCtl(){
  const ctl = $('ctl'); if (!ctl) return;
  const aberta = !!S.v[atual], d = donoDe(atual);
  ctl.replaceChildren(
    el('p', {class:'dica'}, !aberta ? 'Toque na carta para virar.' : d ? 'Com ' + d + '. Toque noutro nome para trocar.' : 'Quem fica com ela?'),
    aberta ? el('div', {class:'donos', role:'group', 'aria-label':'Dono da carta'}, ...JOGADORES.map(n => { const b = el('button', {type:'button', 'aria-pressed':String(d === n), onclick:() => dono(n)}, n); b.style.setProperty('--h', matiz(n)); return b; })) : null,
    aberta ? el('div', {class:'sec'}, d ? el('button', {class:'peq', onclick:() => dono('')}, 'Tirar o dono') : null, el('button', {class:'peq perigo', onclick:desvira}, 'Desvirar e devolver ao monte')) : null);
}
function dono(n){ if (n) S.o[atual] = n; else delete S.o[atual]; salvar(); if (n) { dizer(porCod(atual).n + ' ficou com ' + n); fecha(); } else pintaCtl(); }
function desvira(){ delete S.v[atual]; delete S.o[atual]; salvar(); fecha(); dizer('Carta devolvida ao monte'); }

/* ---- janela: ver a própria mão com zoom (Minha mão) ---- */
let vi = 0, zm = 1;
function ver(i){ vi = i; zm = 1; modo = 'ver'; abre(); pintaVer(); }
function pintaVer(){
  const l = minhas(); if (!l.length) { fecha(); return; }
  vi = (vi + l.length) % l.length; const c = l[vi];
  const z = el('div', {class:'zoomc'}, cartaFace(c)); z.style.setProperty('--z', zm);
  const passo = d => () => { vi += d; zm = 1; pintaVer(); };
  const muda = d => () => { zm = Math.min(2.6, Math.max(.6, +(zm + d).toFixed(2))); pintaVer(); };
  $('mo').replaceChildren(
    el('div', {class:'topo2'}, el('div', {class:'esp'}, c.n), el('span', {class:'cont'}, (vi + 1) + ' / ' + l.length), el('button', {class:'peq', onclick:fecha}, 'Fechar')),
    el('div', {class:'nav2'}, el('button', {class:'peq', 'aria-label':'Carta anterior', onclick:passo(-1)}, '‹'), el('button', {class:'peq', 'aria-label':'Diminuir', onclick:muda(-.3)}, '−'), el('input', {type:'range', min:.6, max:2.6, step:.1, value:zm, 'aria-label':'Zoom', oninput:e => { zm = +e.target.value; z.style.setProperty('--z', zm); }}), el('button', {class:'peq', 'aria-label':'Aumentar', onclick:muda(.3)}, '+'), el('button', {class:'peq', 'aria-label':'Próxima carta', onclick:passo(1)}, '›')),
    el('div', {class:'corpo ver'}, z));
}
document.addEventListener('keydown', e => { if ($('mo').hidden) return; if (e.key === 'Escape') fecha(); else if (modo === 'ver' && e.key === 'ArrowRight') { vi++; zm = 1; pintaVer(); } else if (modo === 'ver' && e.key === 'ArrowLeft') { vi--; zm = 1; pintaVer(); } });

$('zera').addEventListener('click', function(){ if (this.dataset.sim) { S.v = {}; S.o = {}; salvar(); delete this.dataset.sim; this.textContent = 'Desvirar tudo e recomeçar'; pinta(); dizer('Tudo de volta ao monte'); return; } this.dataset.sim = 1; this.textContent = 'Toque de novo para confirmar'; setTimeout(() => { delete this.dataset.sim; this.textContent = 'Desvirar tudo e recomeçar'; }, 3500); });
addEventListener('storage', ev => { if (ev.key !== CHAVE || !ev.newValue) return; try { const j = JSON.parse(ev.newValue); if (j && j.v && j.o) { S.v = j.v; S.o = j.o; if ($('mo').hidden) pinta(); } } catch (e) {} });
pinta();

</script>
