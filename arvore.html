<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Árvore dos Bellacord</title>
<style>
:root{--fundo:#0a0a0b;--painel:#141113;--linha:#2f261d;--marfim:#f1e8dc;--apagado:#9b8f80;--ouro:#c9a24a;--terra:#dd8440}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--marfim);font:14px/1.35 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 40%,#17120e,#0a0a0b 70%)}
#vp.arrasta{cursor:grabbing}
#w{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
svg#ln{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.fr{position:absolute;border:2px solid var(--c);border-radius:18px;background:color-mix(in srgb,var(--c) 7%,transparent)}
.fr h2{position:absolute;left:18px;top:-44px;margin:0;font:600 26px/1 'Inter Tight',Inter,sans-serif;color:var(--c);letter-spacing:.04em;white-space:nowrap}
.gl{position:absolute;white-space:nowrap;font:600 13px/1 Inter,sans-serif;color:#6d6153;letter-spacing:.12em;text-transform:uppercase}
.cd{position:absolute;width:180px;height:262px;border-radius:12px;background:#17130f;border:2px solid color-mix(in srgb,var(--c) 70%,#000);overflow:hidden;box-shadow:0 6px 18px #0008;transition:opacity .2s,box-shadow .2s,transform .2s}
.cd .im{width:100%;height:190px;background:#0e0c0a center top/cover no-repeat;display:grid;place-items:center;font:300 64px/1 Georgia,serif;color:#3a3028}
.cd b{display:block;padding:7px 9px 2px;font-size:14px;line-height:1.15;color:var(--marfim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd small{display:block;padding:0 9px;font-size:11.5px;line-height:1.2;color:var(--apagado);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd.os{border-color:var(--ouro);box-shadow:0 0 0 3px #c9a24a55,0 0 28px #c9a24a66}
.cd.os::after{content:'one-shot';position:absolute;top:7px;right:7px;background:var(--ouro);color:#1a1208;font:700 10px/1 Inter,sans-serif;padding:4px 6px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase}
.cd.sel{transform:scale(1.06);box-shadow:0 0 0 4px var(--marfim),0 10px 30px #000c;z-index:5}
body.foco .cd:not(.sel):not(.viz){opacity:.28}
body.foco .rel:not(.viz),body.foco .fam:not(.viz){opacity:.12}
body.semrel .rel{display:none}
.rel text{font:600 15px Inter,sans-serif;paint-order:stroke;stroke:#0a0a0b;stroke-width:5px}
#bar{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;z-index:10;pointer-events:none}
#bar>*{pointer-events:auto}
#bar button,#bar input{font:inherit;color:var(--marfim);background:#1a1612e6;border:1px solid var(--linha);border-radius:8px;padding:8px 11px;min-height:38px;backdrop-filter:blur(6px)}
#bar button{cursor:pointer}
#bar button[aria-pressed=true]{border-color:var(--ouro);color:#ffe7a8}
#bar input{width:170px}
#bar .tt{font:600 15px/1 'Inter Tight',Inter,sans-serif;color:var(--ouro);letter-spacing:.08em;margin-right:6px;text-shadow:0 1px 4px #000}
#bar .sp{flex:1}
#fechar{font-size:18px!important;padding:6px 13px!important}
#pn{position:fixed;z-index:20;right:12px;top:62px;bottom:12px;width:min(360px,calc(100vw - 24px));background:#141113f2;border:1px solid var(--linha);border-radius:14px;box-shadow:0 10px 40px #000c;display:flex;flex-direction:column;overflow:hidden;transform:translateX(110%);transition:transform .25s ease;backdrop-filter:blur(8px)}
#pn.on{transform:none}
#pn .big{flex:1 1 auto;min-height:160px;background:#0a0908 center/contain no-repeat;position:relative}
#pn .big.vazio{display:grid;place-items:center;color:#3a3028;font:300 90px/1 Georgia,serif}
#pn .tx{padding:12px 14px;overflow:auto;max-height:46%}
#pn h3{margin:0 0 3px;font:600 18px/1.2 'Inter Tight',Inter,sans-serif}
#pn .inf{color:var(--apagado);margin:0 0 6px}
#pn .rm{font-size:12px;color:var(--c,var(--ouro));text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px}
#pn .nt{margin:0 0 8px;font-style:italic}
#pn .rl{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
#pn .rl button{font:12px Inter,sans-serif;color:var(--marfim);background:#201a15;border:1px solid var(--linha);border-radius:99px;padding:4px 9px;cursor:pointer}
#pn .ac{display:flex;gap:8px;flex-wrap:wrap}
#pn .ac button,#pn .ac a{font:600 14px Inter,sans-serif;border-radius:9px;padding:10px 14px;border:1px solid var(--linha);background:#201a15;color:var(--marfim);cursor:pointer;text-decoration:none}
#pn .ac .pri{background:var(--terra);border-color:var(--terra);color:#1a0f06}
#pn .x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:99px;border:0;background:#000a;color:#fff;font-size:18px;cursor:pointer}
#ok{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:#2a1d10;border:1px solid var(--ouro);color:#ffe7a8;padding:9px 14px;border-radius:9px;transition:.25s;z-index:30;pointer-events:none}
#ok.on{opacity:1;transform:translateX(-50%)}
#leg{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:10;background:#141113d9;border:1px solid var(--linha);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--apagado);display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 20px)}
#leg i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
@media (max-width:640px){#bar{gap:4px}#bar input{width:96px}#bar button,#bar input{padding:7px 8px;font-size:13px}#bar .tt{display:none}#pn{top:auto;left:8px;right:8px;width:auto;height:58vh;bottom:8px;transform:translateY(110%)}#pn.on{transform:none}#pn .tx{max-height:none;flex:none}#pn .big{min-height:110px}#leg{display:none}}
</style>
</head>
<body>
<div id="vp"><div id="w"><svg id="ln"></svg></div></div>
<div id="bar">
  <span class="tt">ÁRVORE DOS BELLACORD</span>
  <input id="busca" list="nomes" placeholder="Procurar pessoa…" aria-label="Procurar pessoa"><datalist id="nomes"></datalist>
  <button id="zm" type="button" aria-label="Diminuir zoom">−</button>
  <button id="zp" type="button" aria-label="Aumentar zoom">＋</button>
  <button id="tudo" type="button">Ver tudo</button>
  <button id="soOs" type="button" aria-pressed="false" title="Leva até os personagens do one-shot">One-shot</button>
  <button id="rels" type="button" aria-pressed="true" title="Mostra ou esconde as relações que não são de sangue">Relações</button>
  <span class="sp"></span>
  <button id="fechar" type="button" aria-label="Fechar a árvore" hidden>✕</button>
</div>
<aside id="pn" aria-live="polite"></aside>
<div id="leg"><span><i style="border-color:#bfae94"></i>pais e filhos</span><span><i style="border-color:#bfae94;border-top-style:double;border-top-width:5px"></i>casamento</span><span><i style="border-color:#c9a24a;border-top-style:dashed"></i>criou / treinou</span><span><i style="border-color:#7fb6d8;border-top-style:dashed"></i>aliado / comitiva</span><span><i style="border-color:#e0685a;border-top-style:dashed"></i>caça / rival</span></div>
<div id="ok"></div>

});
// navegação
let S = 1, TX = 0, TY = 0;
const aplica = () => { W.style.transform = `translate(${TX}px,${TY}px) scale(${S})`; };
const lim = s => Math.min(2.5, Math.max(0.05, s));
function zoomEm(px, py, f){ const ns_ = lim(S * f); TX = px - (px - TX) * ns_ / S; TY = py - (py - TY) * ns_ / S; S = ns_; aplica(); }
function enquadra(x0, y0, x1, y1, anim){
  const vw = VP.clientWidth, vh = VP.clientHeight, pad = 30, topo = 60;
  const s = lim(Math.min((vw - pad * 2) / (x1 - x0), (vh - topo - pad) / (y1 - y0)));
  const nt = [(vw - (x1 - x0) * s) / 2 - x0 * s, topo + (vh - topo - pad - (y1 - y0) * s) / 2 - y0 * s];

}
let rafA = 0;
function anima(s2, x2, y2, ms){

  const s1 = S, x1 = TX, y1 = TY, t0 = performance.now();

}

  const vw = VP.clientWidth, vh = VP.clientHeight, larg = PN.classList.contains('on') && vw > 640 ? PN.offsetWidth + 24 : 0, alt = vw <= 640 && PN.classList.contains('on') ? vh * .58 : 0;

const ptr = new Map(); let arr = null, moveu = 0, pin = null;
VP.addEventListener('pointerdown', e => { VP.setPointerCapture(e.pointerId); ptr.set(e.pointerId, {x:e.clientX, y:e.clientY}); cancelAnimationFrame(rafA);

  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pin = {d:Math.hypot(a.x - b.x, a.y - b.y), s:S, mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2, tx:TX, ty:TY}; arr = null; moveu = 99; } });
VP.addEventListener('pointermove', e => { if (!ptr.has(e.pointerId)) return; ptr.set(e.pointerId, {x:e.clientX, y:e.clientY});

let sel = null;

    h('div', {class:'tx', style:{'--c':COR[c.b]}}, h('p', {class:'rm'}, RAMO[c.b] + (c.g < 5 ? ' · ' + c.g + 'ª geração' : '') + (c.os ? ' · one-shot' : '')), h('h3', {}, c.n), h('p', {class:'inf'}, c.i),
      c.o ? h('p', {class:'nt'}, c.o) : null, rel.length ? h('div', {class:'rl'}, rel) : null, ac));

function desseleciona(){ if (sel) byId[sel].el.classList.remove('sel'); sel = null; document.body.classList.remove('foco'); document.querySelectorAll('.viz').forEach(e => e.classList.remove('viz')); PN.classList.remove('on'); }
