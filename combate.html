<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[experimental] Trilha do Cordeiro</title>
<script src="visual.js"></script>
<script>(function(){var r='1';try{var o=JSON.parse(localStorage.getItem('otl_mesa')||'{}');if(o.retos===0)r='0'}catch(e){}document.documentElement.setAttribute('data-cantos',r)})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"></noscript>
<style>
/* Layout: faixa de personagens no topo, duas abas (Seleção para preparar, Sessão para a mesa) e barra de reprodução fixa embaixo. */
:root{
  --fundo:#0a0a0b; --painel:#121012; --painel2:#1a1612; --linha:#2f261d;
  --marfim:#f1e8dc; --apagado:#9b8f80; --terracota:#dd8440; --terracota2:#8a4a22; --ouro:#c9a24a; --erro:#e0685a;
  --titulo:'Inter Tight',system-ui,sans-serif; --texto:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fundo);color:var(--marfim);font:15px/1.45 var(--texto);padding:0 max(16px,env(safe-area-inset-right,0px)) calc(var(--barra-h,360px) + var(--pill-h,0px) + 76px) max(16px,env(safe-area-inset-left,0px))}
header,main{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px 14px;border-bottom:1px solid var(--linha)}
h1{font:400 22px/1 var(--titulo);letter-spacing:.12em;margin:0;color:var(--terracota)}
.abas{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--linha);background:var(--painel2);border-radius:6px;padding:8px 14px}
button:hover{border-color:var(--terracota2)}
button.peq{padding:5px 10px;font-size:13px}
button.perigo{border-color:#7a2a22;background:#3a1512}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.abas button[aria-selected="true"]{background:var(--terracota);border-color:var(--terracota);color:var(--sobre);font-weight:600}
.aviso{margin:14px 0;padding:12px 14px;border:1px solid var(--erro);border-radius:6px;background:#2a1512;color:#ffd9d2;display:flex;gap:12px;align-items:start}
.aviso span{flex:1}
.aviso code{background:#0006;padding:1px 5px;border-radius:3px}
/* Personagens */
.elenco{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:thin}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;white-space:nowrap;flex:none}
.chip.so{padding-left:12px}
.chip[aria-pressed="true"]{background:var(--terracota);border-color:var(--terracota);color:var(--sobre);font-weight:600}
.rosto{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--linha);display:grid;place-items:center;font:400 14px/1 var(--titulo);color:var(--marfim);flex:none}
.chip .n{font-size:11px;opacity:.7}
h2{font:400 20px/1.2 var(--titulo);letter-spacing:.1em;margin:0;color:var(--marfim)}
h3{font:400 14px/1.2 var(--titulo);letter-spacing:.12em;margin:26px 0 10px;color:var(--terracota)}
.sub{color:var(--apagado);margin:0;font-size:13px}
/* Cabeçalho do personagem */
.pers{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:14px 0 18px;padding:14px;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.retrato{width:112px;height:112px;border-radius:8px;object-fit:cover;background:var(--painel2);border:1px solid var(--linha);display:grid;place-items:center;font:400 40px/1 var(--titulo);color:var(--terracota2);flex:none}
.pers .info{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px}
.pers .acoes{display:flex;flex-wrap:wrap;gap:6px}
.pers input.nome{font:400 18px/1.2 var(--titulo);letter-spacing:.06em;width:100%}
.pers input.subt{width:100%;font-size:13px}
.banner{display:flex;gap:16px;align-items:center;margin:18px 0 12px}
.banner .retrato{width:88px;height:88px}
/* Faixas */
.faixa{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:start;padding:14px;border:1px solid var(--linha);border-radius:8px;background:var(--painel);margin-bottom:10px}
.faixa.fora{opacity:.6}
.faixa .usar{margin-top:3px;width:20px;height:20px;accent-color:var(--terracota)}
.faixa .nome{font-weight:600}
.st{color:var(--ouro);margin-right:4px}
.faixa .momento{color:var(--apagado);font-size:13px}
.faixa .estado{font-size:12px;margin-top:4px;color:var(--apagado)}
.faixa .estado.ruim{color:var(--erro)}
.ctrl{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end}
label.c{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado)}
label.lin{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:7px}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--marfim);background:var(--fundo);border:1px solid var(--linha);border-radius:5px;padding:6px 8px;max-width:100%}
input:where(:not([type])){font:inherit;color:var(--marfim);background:var(--fundo);border:1px solid var(--linha);border-radius:5px;padding:6px 8px;max-width:100%;width:230px}
input[type=number]{width:74px}
input[type=text]{width:230px}
input[type=text].largo{width:340px}
input[type=range]{accent-color:var(--terracota);width:110px}
.ouvir.tocando{background:var(--terracota);border-color:var(--terracota);color:var(--sobre);font-weight:600}
.editar{grid-column:2/-1;margin:0;border:0;padding:0;background:none}
.editar summary{font-size:12px;color:var(--apagado);font-weight:400}
.editar .ctrl{margin-top:10px}
a{color:var(--terracota)}
details.cx{margin:14px 0;border:1px solid var(--linha);border-radius:8px;padding:10px 14px;background:var(--painel)}
summary{cursor:pointer;font-weight:600}
.novo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;margin-top:12px}
textarea{width:100%;height:90px;margin:10px 0;font:12px/1.4 ui-monospace,Consolas,monospace}
.lin2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
/* Sessão */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cena{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:104px;padding:14px;border-radius:8px;background:var(--painel)}
.cena .papel{font:400 11px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota)}
.cena .t{font-weight:600;font-size:16px;line-height:1.25}
.cena .m{font-size:12.5px;color:var(--apagado)}
.cena .tecla{margin-top:auto;font-size:11px;color:var(--apagado)}
.cena.tocando{background:var(--terracota);border-color:var(--terracota);color:var(--sobre)}
.cena.tocando .papel,.cena.tocando .m,.cena.tocando .tecla{color:#3a1d0c}
.vazio{color:var(--apagado);padding:14px 0}
/* Barra */
.barra{position:fixed;left:0;right:0;bottom:0;background:#120e0b;border-top:1px solid var(--terracota2);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.players{display:flex;gap:8px}
/* Triagem */
.tri-cfg{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin:18px 0}
.tri-atual{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:20px;margin:16px 0;border:1px solid var(--terracota2);border-radius:10px;background:var(--painel)}
.tri-atual .tx{flex:1 1 300px;min-width:0}
.tri-atual .de{font:400 12px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota)}
.tri-atual .t{font-size:22px;font-weight:600;line-height:1.25;margin:6px 0 4px}
.tri-atual .resta{font-size:13px;color:var(--apagado);margin-top:8px;font-variant-numeric:tabular-nums}
.tri-bot{display:flex;flex-wrap:wrap;gap:8px}
.tri-bot button{padding:14px 22px;font-size:16px}
.tri-bot .fica{background:#24402a;border-color:#3f7a4a}
.tri-bot .sai{background:#3a1512;border-color:#7a2a22}
.tri-lista{display:flex;flex-direction:column;gap:4px}
.tri-lista button{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 12px;background:none;border-color:transparent}
.tri-lista button:hover{border-color:var(--linha)}
.tri-lista button.atual{background:var(--painel2);border-color:var(--terracota2)}
.tri-lista .marca{width:44px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);flex:none}
.tri-lista .marca.fica{color:#7fc98c}
.tri-lista .q{color:var(--apagado);font-size:12px;margin-left:auto;white-space:nowrap}
.players .cx{width:200px;height:200px;background:#000;border:1px solid var(--linha);border-radius:4px;overflow:hidden}
.players.mini{position:absolute;left:-9999px}
@media (max-width:640px){.faixa{grid-template-columns:auto 1fr}.faixa .ouvir{grid-column:2;justify-self:start}.ctrl,.editar{grid-column:1/-1}.players .cx{width:150px;height:150px}.tri-bot button{flex:1 1 40%}}

/* Mestre */
.palco{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:16px 0;padding:16px;border:1px solid var(--terracota2);border-radius:12px;background:linear-gradient(135deg,var(--painel),#120e0b)}
.palco .arte{width:150px;height:210px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--linha);background:var(--painel2);flex:none;display:grid;place-items:center;font:400 44px/1 var(--titulo);color:var(--terracota2)}
.palco .tx{flex:1 1 280px;min-width:0}
.palco .de{font:400 12px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota)}
.palco .t{font-size:24px;font-weight:600;line-height:1.2;margin:8px 0 4px}
.painel{margin:14px 0;padding:14px;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.painel h3{margin-top:0}
.apoio{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.apoio .ap{display:flex;gap:12px;padding:12px;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.apoio .ap img{width:74px;height:104px;object-fit:cover;object-position:top;border-radius:6px;flex:none;background:var(--painel2)}
.apoio .ap .n{font:400 15px/1.2 var(--titulo);letter-spacing:.06em}
.apoio .ap .p{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--terracota);margin:2px 0 6px}
.apoio .ap .d{font-size:13px;color:var(--apagado);line-height:1.4}
.cena .mini{width:100%;height:84px;object-fit:cover;object-position:top;border-radius:5px;margin:-4px 0 4px;opacity:.9}

.noite{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.noite .bloco{padding:12px;border:1px solid var(--linha);border-radius:10px;background:var(--painel2)}
.noite .bloco h4{font:400 12px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota);margin:0 0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:42px;padding:10px 0;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--terracota);border-color:var(--terracota);color:var(--sobre)}
.grande{font:400 54px/1 var(--titulo);color:var(--marfim);text-align:center;font-variant-numeric:tabular-nums}
.lirio{display:block;margin:0 auto;width:120px;height:120px}
.aviso2{margin:10px 0 0;padding:8px 10px;border-radius:6px;background:#3a2410;border:1px solid var(--ouro);color:#ffe9b8;font-size:13px}
.abates{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ab{display:flex;gap:10px;padding:10px;border:1px solid var(--linha);border-radius:10px;background:var(--painel2)}
.ab img,.ab .ini{width:56px;height:78px;object-fit:cover;object-position:top;border-radius:6px;flex:none;background:var(--fundo);display:grid;place-items:center;font:400 26px/1 var(--titulo);color:var(--terracota2)}
.ab .c{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ab .nm{font-weight:600}
.ab .bts{display:flex;flex-wrap:wrap;gap:5px}
.ab.morto{opacity:.55}
.ab.morto img{filter:grayscale(1)}
.ab .ok{color:#7fc98c;font-size:12px}
.fim{margin-top:12px;padding:14px;border:1px solid #3f7a4a;border-radius:8px;background:#162a1b}
textarea.notas{height:120px;font:14px/1.45 var(--texto)}

.rot{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:10px;padding-right:4px}
.pas{display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--painel2)}
.pas.atual{border-color:var(--terracota);background:#2a1d14}
.pas.feito{opacity:.55}
.pas .num{font:400 13px/1 var(--titulo);color:var(--terracota);text-align:center}
.pas .tt{font-weight:600;line-height:1.25}
.pas .fx{font-size:12px;color:var(--apagado)}
.pas .nota{grid-column:2/-1;font-size:13px;color:var(--marfim);opacity:.85}
.pas .ed{grid-column:1/-1}
.rot-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rot-top .grow{flex:1}
.gat{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.gat button{display:flex;gap:10px;text-align:left;align-items:center}
.gat button.fora{border-style:dashed;color:#c2b5a4}
.gat button .q{font-weight:600}
.gat button .t{color:var(--apagado);font-size:12px}


.cxm>summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}.cxm>summary::-webkit-details-marker{display:none}.cxm>summary::before{content:'▸ ';color:var(--ouro)}.cxm[open]>summary::before{content:'▾ '}.cxm[open]>summary{margin-bottom:10px}
.ini2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--linha);border-radius:8px;margin-bottom:6px}.ini2.vez{border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro)}.ini2.caiu{opacity:.5}
.ini2 .n,.n{width:9.5em;max-width:100%}.q{width:4.6em}.c{min-width:8em;flex:1}.pvn{min-width:5.5em}
.apests{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:10px}.apest{display:flex;gap:10px}.apest img{width:64px;height:64px;object-fit:cover;border-radius:8px}.c2{display:flex;flex-direction:column;font-size:12px;gap:2px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}.chk .ok{color:var(--ouro);font-weight:600}
.virt,.jg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}.virt b{min-width:6.5em}.virt.tom b{color:var(--ouro)}.jg.falou .n{opacity:.55}
.lp{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}.lp.atual b{color:var(--ouro)}.lp textarea,.larga{width:100%;box-sizing:border-box}
.dnovo{font-size:22px;font-weight:600;margin-top:8px}.dados{margin-top:6px}.vol2{display:flex;gap:8px;align-items:center;font-size:12px}
.grande2{font-weight:600}
.inm-abas{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin;margin-top:10px}
.inm-aba{display:flex;align-items:center;gap:8px;flex:none;min-height:44px;padding:4px 14px 4px 5px;border-radius:999px;white-space:nowrap}
.inm-aba img,.inm-todos{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--linha);display:grid;place-items:center;flex:none}
.inm-aba[aria-selected="true"]{background:var(--terracota);border-color:var(--terracota);color:var(--sobre);font-weight:600}
.inm-fil{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.inm-f{min-height:40px;padding:4px 11px;border-radius:999px;font-size:13px;border-color:color-mix(in srgb,var(--tc,#a8998a) 55%,transparent);color:var(--tc,var(--marfim))}
.inm-f.tp{--tc:#d8cbb4}
.inm-f small{margin-left:2px}
.inm-f[aria-pressed="true"]{background:var(--tc,var(--terracota));color:var(--sobre);font-weight:600}
.inm-lim{min-height:40px;margin-top:8px}
.inm-rot{font-size:12px;color:var(--apagado)}.inm-rot.gasta{color:var(--erro)}.inm-rot.pronta{color:#6fcf8f}
.inm-ult{margin-top:12px;padding:8px 10px;border:1px dashed var(--linha);border-radius:8px;font-size:13px}.inm-ult b{display:block;color:var(--ouro);margin-bottom:2px}
.inm-bl{margin-top:16px}
.inm-topo{display:flex;gap:10px;align-items:center;margin-bottom:8px}.inm-topo img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.inm-topo h4{margin:0;font:400 17px/1.2 var(--titulo);letter-spacing:.08em;color:var(--terracota)}
.inm-avs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.inm-av{font-size:12px;color:var(--apagado);border:1px solid var(--linha);border-radius:6px;padding:2px 7px}.inm-av.agora{color:var(--sobre);background:var(--ouro);border-color:var(--ouro);font-weight:600}
.inm-card{margin-top:8px;padding:10px 12px;border:1px solid var(--linha);border-left:3px solid var(--terracota2);border-radius:8px;background:var(--painel2)}
.inm-card.pass{border-left-color:var(--linha);opacity:.92}.inm-card.esgotada{opacity:.55}
.inm-cab{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.inm-nome{font-size:15px}
.inm-tipo{font-size:11px;padding:1px 8px;border-radius:999px;background:#3a2f27;color:var(--marfim);border:1px solid #5a4a3d}
.inm-tipo.t-padrao{background:var(--terracota2)}.inm-tipo.t-bonus{background:#6b5a22}.inm-tipo.t-reacao{background:#2d4a6b}.inm-tipo.t-livre{background:#3d5a3a}
.inm-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.inm-tag{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tc) 60%,transparent);background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.inm-txt{margin:8px 0 0;font-size:14px}
.inm-uso{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px}
.inm-bol{min-width:44px;min-height:44px;padding:0;display:grid;place-items:center;background:none;border:0}
.inm-bol i{width:22px;height:22px;border-radius:50%;border:2px solid var(--terracota);display:block}.inm-bol.on i{background:var(--terracota);opacity:.5;border-color:var(--apagado)}
.inm-lin{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.inm-lin button,.inm-rec{min-height:40px}
.inm-usar{background:var(--terracota2);border-color:var(--terracota)}
.inm-res{margin-top:6px;padding:6px 10px;border-radius:6px;background:#0e0b09;border:1px solid var(--ouro);color:var(--ouro);font-variant-numeric:tabular-nums;font-size:14px;overflow-wrap:anywhere}

/* Rodada 2: iniciativa integrada, favoritas, aplicar, faixa de turno */
.inm-topo{flex-wrap:wrap}.inm-topo.vez img{outline:2px solid var(--ouro)}
.inm-ini{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.inm-ini input{min-height:40px;width:4.6em}.inm-ini input.inv{border-color:var(--erro);box-shadow:0 0 0 1px var(--erro)}
.inm-ini button{min-height:40px;min-width:40px}
.inm-na{font-size:13px;color:#6fcf8f;font-weight:600}.inm-pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.inm-pv input.dv{width:6.2em;text-align:center}
.inm-vez{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:6px 10px;border:1px solid var(--ouro);border-radius:8px;background:color-mix(in srgb,var(--ouro) 14%,transparent)}

const gi = (n, cls = '') => { const e = document.createElement('span'); e.className = 'gi ' + cls; e.setAttribute('aria-hidden', 'true'); e.innerHTML = '<svg viewBox="0 0 512 512" fill="currentColor">' + (GI[n] || GI.padlock) + '</svg>'; return e; };
const ico = (n, cheio) => { const e = document.createElement('span'); e.className = 'ic' + (cheio ? ' cheio' : ''); e.setAttribute('aria-hidden','true'); e.innerHTML = '<svg viewBox="0 0 24 24">' + ICO[n] + '</svg>'; return e; };
const rosto = (g, cls='rosto') => g && g.img ? el('img',{class:cls, src:g.img, alt:'', loading:'eager'}) : el('span',{class:cls, 'aria-hidden':'true'}, g ? (g.nome.replace(/^[^A-Za-zÀ-ÿ]+/,'')[0]||'?').toUpperCase() : '');

// ---------- Players do YouTube: dois, para cruzar uma música na outra ----------
// O volume é controlado só por esta página (vol[i]); o player é sempre "desmutado" quando começa a tocar.
let P = [null,null], pronto = [false,false], ativo = 0, emP = [null,null], fades = [null,null], vol = [0,0], espera = [null,null];
let tocando = null, fila = [], tri = null, triFim = '';
let ord = [], plAuto = false, plNome = '';      // ord: ordem em que a lista toca (embaralhada se o aleatório estiver ligado); plAuto: segue sozinha para a próxima
const falhou = {}, estados = {};
let voz = false; const hist = [];                            // voz: música abaixada enquanto o Mestre fala; hist: faixas anteriores, para retomar
const alvoDe = f => Math.round(f.vol * E.mestre / 100 * (voz ? E.vozNivel/100 : 1) * (0.6 + 0.1*((E.intens||5)-1)));
function aplicarVol(i){ try { P[i].unMute(); P[i].setVolume(Math.round(vol[i])); } catch(e){} }
function fade(i, ate, ms, fim){
  clearInterval(fades[i]); fades[i] = null; if (!pronto[i]) return;
  const de = vol[i], t0 = performance.now(); let ult = -1;   // por relógio: termina na hora certa mesmo se o navegador atrasar os temporizadores
  fades[i] = setInterval(() => { const k = ms > 0 ? Math.min(1, (performance.now() - t0) / ms) : 1; vol[i] = de + (ate-de)*k;
    if (Math.round(vol[i]) !== ult || k >= 1) { ult = Math.round(vol[i]); aplicarVol(i); }
    if (k >= 1) { clearInterval(fades[i]); fades[i] = null; fim && fim(); } }, 50);
}
function tocar(f, ms, op={}){
  if (!pronto[0] || !pronto[1]) { aviso('O player do YouTube ainda não carregou. Confira a internet e recarregue a página.'); return; }
  if (!videoDe(f)) { estados[f.id] = 'Esta música não tem vídeo. Cole um link do YouTube.'; desenhar(); return; }
  if (tocando === f && !op.forcar) { parar(1200); return; }
  ms = ms ?? E.cruzar*1000;
  if (tocando && tocando !== f && !tri && !op.retomar) { let t = 0; try { t = P[ativo].getCurrentTime(); } catch(e){} hist.push({f:tocando, t}); if (hist.length > 12) hist.shift(); }
  if (op.fila) { fila = op.fila; plAuto = !!op.lista; plNome = op.nome || ''; montaOrdem(f); }
  else if (!ord.includes(f)) { fila = [f]; plAuto = false; plNome = ''; montaOrdem(f); }
  const novo = 1-ativo, velho = ativo;
  if (emP[velho]) { emP[velho] = null; espera[velho] = null; fade(velho, 0, ms, () => { try { P[velho].pauseVideo(); } catch(e){} }); }
  emP[novo] = f; tocando = f; ativo = novo; delete estados[f.id]; falhou[f.id] = 0;
  clearInterval(fades[novo]); fades[novo] = null; vol[novo] = 0;
  espera[novo] = {ms, meio:!!op.meio};                       // o volume sobe quando o vídeo começa de fato a tocar
  P[novo].loadVideoById({videoId:videoDe(f), startSeconds:op.meio ? 0 : (op.inicio ?? (+f.inicio||0))});
  if (tri) tri.ms = 0;
  marcar();
}
function parar(ms=0){
  for (const i of [0,1]) { if (!pronto[i]) continue; espera[i] = null;
    if (ms) fade(i, 0, ms, () => { try { P[i].pauseVideo(); } catch(e){} });
    else { clearInterval(fades[i]); fades[i] = null; vol[i] = 0; try { P[i].pauseVideo(); } catch(e){} }
    emP[i] = null; }
  tocando = null; tri = null; marcar();
}
function aoMudar(i, ev){
  const f = emP[i]; if (!f) return;
  if (ev.data === 1 && espera[i]) { const w = espera[i]; espera[i] = null;
    if (w.meio) { let d = 0; try { d = P[i].getDuration(); } catch(e){}
      if (d > 30) P[i].seekTo(Math.max(0, d/2 - (E.previa||120)/2), true); }   // a prévia fica centrada no meio da música
    fade(i, alvoDe(f), w.ms); }
  if (ev.data === 0) {
    if (tri && tocando === f) triIr(1);
    else if (tocando === f && modoRep() === 'one') { P[i].seekTo(+f.inicio||0, true); P[i].playVideo(); }
    else if (tocando === f && !vizinha(1, true)) { emP[i] = null; tocando = null; marcar(); }
  }
}
function aoErro(i, ev){
  const f = emP[i]; if (!f) return;
  if (ev.data === 153) { aviso('O YouTube recusou tocar porque a página foi aberta direto do arquivo. Use o endereço do GitHub ou o <code>abrir_trilha.bat</code>.'); parar(); return; }
  falhou[f.id] = (falhou[f.id]||0) + 1;
  if (!idDoLink(f.link) && falhou[f.id] < f.videos.length) {      // esta gravação não toca fora do YouTube: tenta a próxima
    f.grav = (f.grav+1) % f.videos.length; salvar();
    P[i].loadVideoById({videoId:videoDe(f), startSeconds:espera[i] && espera[i].meio ? 0 : (+f.inicio||0)}); desenhar();
  } else { estados[f.id] = 'Nenhuma gravação tocou aqui. Cole outro link do YouTube.'; if (tri) triIr(1); else parar(); }
}
window.onYouTubeIframeAPIReady = () => { [0,1,2].forEach(i => { P[i] = new YT.Player('p'+i, { width:'100%', height:'100%',
  playerVars:{playsinline:1, rel:0, controls:1, origin:location.origin},
  events:{ onReady:()=>{ pronto[i]=true; }, onStateChange:ev=>i===2 ? aoMudarAmb(ev) : aoMudar(i,ev), onError:ev=>i===2 ? aoErroAmb(ev) : aoErro(i,ev) } }); }); };
(function(){ const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => aviso('Não consegui carregar o player do YouTube. Confira a internet.'); document.head.append(s); })();


// ---------- Ferramentas de áudio para narrar: voz, retomar, repetir, ajuste de volume ----------
let msgBarra = {t:'', ate:0};
const dizer = t => { msgBarra = {t, ate:Date.now()+2200}; };
function alternarVoz(ligar){
  voz = ligar ?? !voz; $('btVoz').setAttribute('aria-pressed', String(voz)); $('btVoz').title = voz ? 'Voz ligada: a música está abaixada (tecla V)' : 'Voz: abaixa a música enquanto você fala (tecla V; segure ou toque)';
  if (tocando && pronto[ativo] && !espera[ativo]) fade(ativo, alvoDe(tocando), 350);
  ambAplicar();
}
function retomar(){
  while (hist.length) { const h = hist.pop();
    if (h.f !== tocando && todas().includes(h.f)) { tocar(h.f, null, {forcar:true, inicio:h.t, retomar:true}); dizer('Voltou para ' + h.f.nome); return; } }
  dizer('Não há música anterior para retomar.');
}
function modoRep(){ const r = E.repMod; if (r === 'off' || r === 'all' || r === 'one') return r === 'all' && !plAuto ? 'off' : r;
  return plAuto ? 'all' : (tocando && tocando.repetir ? 'one' : 'off'); }
function alternarRepetir(){ const a = modoRep(), p = plAuto ? {off:'all', all:'one', one:'off'} : {off:'one', all:'one', one:'off'};
  E.repMod = p[a]; salvar(); dizer(E.repMod === 'one' ? 'Repetindo só esta música' : E.repMod === 'all' ? 'Repetindo a lista' : 'Repetir desligado'); desenhar(['palco']); }
function embaralha(l, primeiro){ for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }
  if (primeiro) { const k = l.indexOf(primeiro); if (k > 0) { l.splice(k, 1); l.unshift(primeiro); } } return l; }
function montaOrdem(atual){ ord = fila.slice(); if (E.aleat && ord.length > 1) embaralha(ord, atual); }
function alternarAleat(){ E.aleat = !E.aleat; salvar(); montaOrdem(tocando); dizer(E.aleat ? 'Ordem aleatória' : 'Ordem da lista'); if (!$('filaPainel').hidden) desenharFila(); }
function ajustarFaixa(d){ if (!tocando) return; tocando.vol = Math.max(5, Math.min(100, (+tocando.vol||100) + d)); salvar();
  if (!espera[ativo]) { clearInterval(fades[ativo]); fades[ativo] = null; vol[ativo] = alvoDe(tocando); aplicarVol(ativo); }
  dizer('Volume desta música: ' + tocando.vol + '%'); }

// ---------- Transporte: pausar, avançar e trocar de faixa ----------
const estadoP = () => { try { return P[ativo].getPlayerState(); } catch(e){ return -1; } };
function pausar(){ if (!tocando) return; try { if (estadoP() === 2) P[ativo].playVideo(); else P[ativo].pauseVideo(); } catch(e){} }
function saltar(seg){ if (!tocando) return; try { P[ativo].seekTo(Math.max(0, P[ativo].getCurrentTime()+seg), true); } catch(e){} }
const tocavel = f => todas().includes(f) && !!videoDe(f);
function vizinha(d, auto){                                    // faixa anterior ou próxima da lista; auto = a música acabou
  if (tri) { triIr(d); return true; }
  if (auto && !plAuto) return false;                          // só as listas (luta, "Tocar a lista") seguem sozinhas
  const i = ord.indexOf(tocando); if (i < 0) return false;
  if (d < 0 && !auto) { let t = 0; try { t = P[ativo].getCurrentTime(); } catch(e){} if (t > 4 || i === 0 && modoRep() !== 'all') { try { P[ativo].seekTo(+tocando.inicio||0, true); } catch(e){} return true; } }
  let j = i;
  for (let k = 0; k < ord.length; k++) {
    j += d;
    if (j >= ord.length || j < 0) {
      if (!(plAuto && modoRep() === 'all')) return false;
      if (j >= ord.length && E.aleat && ord.length > 1) { embaralha(ord); if (ord[0] === tocando) ord.push(ord.shift()); }
      j = j < 0 ? ord.length - 1 : 0; }
    if (tocavel(ord[j])) { tocar(ord[j], null, {forcar:true}); return true; } }
  return false;
}
function listaDoGrupo(gid, papel = 'combate'){ const g = E.grupos.find(x => x.id === gid); return g ? g.faixas.filter(f => f.usar && f.papel === papel && videoDe(f)) : []; }
function tocarLista(lista, nome){
  if (!lista.length) { aviso('Nenhuma música de ' + (nome || 'combate') + ' marcada. Marque na aba Seleção as que devem tocar.'); return false; }
  const f = E.aleat && lista.length > 1 ? lista[Math.floor(Math.random() * lista.length)] : lista[0];
  tocar(f, null, {fila:lista.slice(), lista:true, nome, forcar:true}); return true; }
const GRUPO_DE_INIMIGO = id => id === 'anjo' ? 'demonio' : id;
function musicaDaLuta(ids){
  if (E.musicaLuta === false) return;
  const gs = [...new Set(ids.map(GRUPO_DE_INIMIGO))], l = gs.flatMap(g => listaDoGrupo(g)), nomes = gs.map(g => (E.grupos.find(x => x.id === g) || {nome:g}).nome.split(' — ')[0]).join(' e ');
  if (l.length) tocarLista(l, nomes + ' · combate'); else aviso('Nenhuma música de combate marcada para ' + nomes + '. Marque na aba Seleção.'); }

// ---------- Triagem: toca um trecho do meio de cada música, para decidir quais ficam ----------
function triLista(){ const esc = E.triEsc||'todos', q = E.triQuais||'todas';
  return E.grupos.filter(g => esc==='todos' || g.id===esc).flatMap(g => g.faixas).filter(f => q==='todas' || (q==='marcadas') === !!f.usar); }
function triComecar(){ const l = triLista(); if (!l.length) return;
  triFim = ''; tri = {lista:l, pos:0, ms:0, visto:{}}; tocar(l[0], 600, {forcar:true, meio:E.meio!==false}); }
function triIr(d){ if (!tri) return; const p = tri.pos + d; if (p < 0) return;
  if (p >= tri.lista.length) { triFim = 'Triagem concluída: ' + tri.lista.filter(f => f.usar).length + ' de ' + tri.lista.length + ' músicas ficam.'; parar(1200); return; }
  tri.pos = p; tocar(tri.lista[p], 600, {forcar:true, meio:E.meio!==false}); }
function triDecidir(fica){ if (!tri) return; const f = tri.lista[tri.pos]; f.usar = fica; tri.visto[f.id] = 1; salvar(); triIr(1); }
function desenharTriagem(){
  const raiz = document.getElementById('triagem'); raiz.replaceChildren();

    const mud = (k, conv=x=>x) => ev => { E[k] = conv(ev.target.type==='checkbox' ? ev.target.checked : ev.target.value); salvar(); desenhar(); };

  {"id":"esboco-e-tinta","nome":"Esboço e Tinta","cat":"passiva","tags":["area","dano","controle"],"txt":"*Esboço:* linhas de grafite, nada acontece. Borrar (ação, Des ou For CD 18) cancela; água ou gélido apagam sem teste. No máximo 4 Esboços. *Tinta:* no fim da rodada seguinte o Esboço detona: Des CD 21, **10d6 (35)** do pigmento (metade se passar), mais o efeito extra; a área vira Tinta Fresca (2d6 (7) por turno) e na rodada seguinte seca em terreno difícil com o mesmo dano. No máximo 3 manchas. Esboços de pigmentos opostos que se sobreponham (Carmim e Verde, Azul e Amarelo, Preto e Branco) viram cinza e somem. Tudo some a cada Virada da Tela.","cd":[["Des",21]],"dano":[{"e":"10d6","m":35,"t":"do pigmento","k":"d"}]},

  {"id":"virada-da-tela","nome":"Virada da Tela","cat":"passiva","par":"Uma vez, a 50% dos PV","tags":["buff","controle"],"txt":"No Formato A, uma vez, quando os PV chegam a **50% do PV usado** ou abaixo, ficam exatamente nesse limiar (o dano que sobrar é perdido) e ela vira o cavalete. O grupo cai na Tela III, sem salvaguarda e sem perda de PV. Todo Esboço e toda Tinta somem, as Molduras se desfazem e os capturados voltam, o limite de Não Hoje reinicia e ela ganha **40 PV temporários**. Fora do Formato A: a 2/3 e a 1/3 dos PV."},
