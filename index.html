<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha do Cordeiro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Marcellus&display=swap">
<style>
/* Layout: faixa de personagens no topo, duas abas (Seleção para preparar, Sessão para a mesa) e barra de reprodução fixa embaixo. */
:root{
  --fundo:#0e0b09; --painel:#1a1512; --painel2:#241d18; --linha:#3a2f27;
  --marfim:#efe6d2; --apagado:#a8998a; --terracota:#d9763f; --terracota2:#8f4a26; --ouro:#c9a24a; --erro:#e0685a;
  --titulo:'Marcellus SC','Marcellus',Georgia,serif; --texto:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fundo);color:var(--marfim);font:15px/1.45 var(--texto);padding:0 max(16px,env(safe-area-inset-right,0px)) 360px max(16px,env(safe-area-inset-left,0px))}
header,main{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px 14px;border-bottom:1px solid var(--linha)}
h1{font:400 22px/1 var(--titulo);letter-spacing:.12em;margin:0;color:var(--terracota)}
.abas{display:flex;gap:6px;margin-left:auto}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--linha);background:var(--painel2);border-radius:6px;padding:8px 14px}
button:hover{border-color:var(--terracota2)}
button.peq{padding:5px 10px;font-size:13px}
button.perigo{border-color:#7a2a22;background:#3a1512}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.abas button[aria-selected="true"]{background:var(--terracota);border-color:var(--terracota);color:#1a0f08;font-weight:600}
.aviso{margin:14px 0;padding:12px 14px;border:1px solid var(--erro);border-radius:6px;background:#2a1512;color:#ffd9d2;display:flex;gap:12px;align-items:start}
.aviso span{flex:1}
.aviso code{background:#0006;padding:1px 5px;border-radius:3px}
/* Personagens */
.elenco{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:thin}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;white-space:nowrap;flex:none}
.chip.so{padding-left:12px}
.chip[aria-pressed="true"]{background:var(--terracota);border-color:var(--terracota);color:#1a0f08;font-weight:600}
.rosto{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--linha);display:grid;place-items:center;font:400 14px/1 var(--titulo);color:var(--marfim);flex:none}
.chip .n{font-size:11px;opacity:.7}
h2{font:400 20px/1.2 var(--titulo);letter-spacing:.1em;margin:0;color:var(--marfim)}
h3{font:400 14px/1.2 var(--titulo);letter-spacing:.12em;margin:26px 0 10px;color:var(--terracota)}
.sub{color:var(--apagado);margin:0;font-size:13px}
/* Cabeçalho do personagem */
.pers{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:14px 0 18px;padding:14px;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.retrato{width:112px;height:112px;border-radius:8px;object-fit:cover;background:var(--painel2);border:1px solid var(--linha);display:grid;place-items:center;font:400 40px/1 var(--titulo);color:var(--terracota2);flex:none}
.pers .info{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px}
.pers .acoes{display:flex;flex-wrap:wrap;gap:6px}
.pers input.nome{font:400 18px/1.2 var(--titulo);letter-spacing:.06em;width:100%}
.pers input.subt{width:100%;font-size:13px}
.banner{display:flex;gap:16px;align-items:center;margin:18px 0 12px}
.banner .retrato{width:88px;height:88px}
/* Faixas */
.faixa{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:start;padding:14px;border:1px solid var(--linha);border-radius:8px;background:var(--painel);margin-bottom:10px}
.faixa.fora{opacity:.6}
.faixa .usar{margin-top:3px;width:20px;height:20px;accent-color:var(--terracota)}
.faixa .nome{font-weight:600}
.st{color:var(--ouro);margin-right:4px}
.faixa .momento{color:var(--apagado);font-size:13px}
.faixa .estado{font-size:12px;margin-top:4px;color:var(--apagado)}
.faixa .estado.ruim{color:var(--erro)}
.ctrl{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end}
label.c{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado)}
label.lin{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:7px}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--marfim);background:var(--fundo);border:1px solid var(--linha);border-radius:5px;padding:6px 8px;max-width:100%}
input[type=number]{width:74px}
input[type=text]{width:230px}
input[type=text].largo{width:340px}
input[type=range]{accent-color:var(--terracota);width:110px}
.ouvir.tocando{background:var(--terracota);border-color:var(--terracota);color:#1a0f08;font-weight:600}
.editar{grid-column:2/-1;margin:0;border:0;padding:0;background:none}
.editar summary{font-size:12px;color:var(--apagado);font-weight:400}
.editar .ctrl{margin-top:10px}
a{color:var(--terracota)}
details.cx{margin:14px 0;border:1px solid var(--linha);border-radius:8px;padding:10px 14px;background:var(--painel)}
summary{cursor:pointer;font-weight:600}
.novo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;margin-top:12px}
textarea{width:100%;height:90px;margin:10px 0;font:12px/1.4 ui-monospace,Consolas,monospace}
.lin2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
/* Sessão */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cena{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:104px;padding:14px;border-radius:8px;background:var(--painel)}
.cena .papel{font:400 11px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota)}
.cena .t{font-weight:600;font-size:16px;line-height:1.25}
.cena .m{font-size:12.5px;color:var(--apagado)}
.cena .tecla{margin-top:auto;font-size:11px;color:var(--apagado)}
.cena.tocando{background:var(--terracota);border-color:var(--terracota);color:#1a0f08}
.cena.tocando .papel,.cena.tocando .m,.cena.tocando .tecla{color:#3a1d0c}
.vazio{color:var(--apagado);padding:14px 0}
/* Barra */
.barra{position:fixed;left:0;right:0;bottom:0;background:#120e0b;border-top:1px solid var(--terracota2);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.barra .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.agora{flex:1 1 240px;min-width:0;display:flex;gap:12px;align-items:center}
.agora .rosto{width:44px;height:44px}
.agora .tx{min-width:0}
.agora .rot{font:400 11px/1 var(--titulo);letter-spacing:.14em;color:var(--apagado)}
.agora .tit{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agora .tempo{font-size:12px;color:var(--apagado);font-variant-numeric:tabular-nums}
.barra .vol{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--apagado)}
.barra .vol input{width:140px}
.transp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.transp #btPausa{min-width:104px;background:var(--terracota);border-color:var(--terracota);color:#1a0f08;font-weight:600}
.linhaPos{flex:1 1 100%;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--apagado);font-variant-numeric:tabular-nums}
.linhaPos input{flex:1;width:auto;min-width:0}
.players{display:flex;gap:8px}
/* Triagem */
.tri-cfg{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin:18px 0}
.tri-atual{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:20px;margin:16px 0;border:1px solid var(--terracota2);border-radius:10px;background:var(--painel)}
.tri-atual .tx{flex:1 1 300px;min-width:0}
.tri-atual .de{font:400 12px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota)}
.tri-atual .t{font-size:22px;font-weight:600;line-height:1.25;margin:6px 0 4px}
.tri-atual .resta{font-size:13px;color:var(--apagado);margin-top:8px;font-variant-numeric:tabular-nums}
.tri-bot{display:flex;flex-wrap:wrap;gap:8px}
.tri-bot button{padding:14px 22px;font-size:16px}
.tri-bot .fica{background:#24402a;border-color:#3f7a4a}
.tri-bot .sai{background:#3a1512;border-color:#7a2a22}
.tri-lista{display:flex;flex-direction:column;gap:4px}
.tri-lista button{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 12px;background:none;border-color:transparent}
.tri-lista button:hover{border-color:var(--linha)}
.tri-lista button.atual{background:var(--painel2);border-color:var(--terracota2)}
.tri-lista .marca{width:44px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);flex:none}
.tri-lista .marca.fica{color:#7fc98c}
.tri-lista .q{color:var(--apagado);font-size:12px;margin-left:auto;white-space:nowrap}
.players .cx{width:200px;height:200px;background:#000;border:1px solid var(--linha);border-radius:4px;overflow:hidden}
.players.mini{position:absolute;left:-9999px}
@media (max-width:640px){.faixa{grid-template-columns:auto 1fr}.faixa .ouvir{grid-column:2;justify-self:start}.ctrl,.editar{grid-column:1/-1}.players .cx{width:150px;height:150px}body{padding-bottom:470px}.tri-bot button{flex:1 1 40%}}

/* Mestre */
.palco{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:16px 0;padding:16px;border:1px solid var(--terracota2);border-radius:12px;background:linear-gradient(135deg,var(--painel),#120e0b)}
.palco .arte{width:150px;height:210px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--linha);background:var(--painel2);flex:none;display:grid;place-items:center;font:400 44px/1 var(--titulo);color:var(--terracota2)}
.palco .tx{flex:1 1 280px;min-width:0}
.palco .de{font:400 12px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota)}
.palco .t{font-size:24px;font-weight:600;line-height:1.2;margin:8px 0 4px}
.painel{margin:14px 0;padding:14px;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.painel h3{margin-top:0}
.apoio{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.apoio .ap{display:flex;gap:12px;padding:12px;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.apoio .ap img{width:74px;height:104px;object-fit:cover;object-position:top;border-radius:6px;flex:none;background:var(--painel2)}
.apoio .ap .n{font:400 15px/1.2 var(--titulo);letter-spacing:.06em}
.apoio .ap .p{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--terracota);margin:2px 0 6px}
.apoio .ap .d{font-size:13px;color:var(--apagado);line-height:1.4}
.cena .mini{width:100%;height:84px;object-fit:cover;object-position:top;border-radius:5px;margin:-4px 0 4px;opacity:.9}

.noite{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.noite .bloco{padding:12px;border:1px solid var(--linha);border-radius:10px;background:var(--painel2)}
.noite .bloco h4{font:400 12px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota);margin:0 0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:42px;padding:10px 0;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--terracota);border-color:var(--terracota);color:#1a0f08}
.grande{font:400 54px/1 var(--titulo);color:var(--marfim);text-align:center;font-variant-numeric:tabular-nums}
.lirio{display:block;margin:0 auto;width:120px;height:120px}
.aviso2{margin:10px 0 0;padding:8px 10px;border-radius:6px;background:#3a2410;border:1px solid var(--ouro);color:#ffe9b8;font-size:13px}
.abates{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ab{display:flex;gap:10px;padding:10px;border:1px solid var(--linha);border-radius:10px;background:var(--painel2)}
.ab img,.ab .ini{width:56px;height:78px;object-fit:cover;object-position:top;border-radius:6px;flex:none;background:var(--fundo);display:grid;place-items:center;font:400 26px/1 var(--titulo);color:var(--terracota2)}
.ab .c{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ab .nm{font-weight:600}
.ab .bts{display:flex;flex-wrap:wrap;gap:5px}
.ab.morto{opacity:.55}
.ab.morto img{filter:grayscale(1)}
.ab .ok{color:#7fc98c;font-size:12px}
.fim{margin-top:12px;padding:14px;border:1px solid #3f7a4a;border-radius:8px;background:#162a1b}
textarea.notas{height:120px;font:14px/1.45 var(--texto)}

.rot{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:10px;padding-right:4px}
.pas{display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--painel2)}
.pas.atual{border-color:var(--terracota);background:#2a1d14}
.pas.feito{opacity:.55}
.pas .num{font:400 13px/1 var(--titulo);color:var(--terracota);text-align:center}
.pas .tt{font-weight:600;line-height:1.25}
.pas .fx{font-size:12px;color:var(--apagado)}
.pas .nota{grid-column:2/-1;font-size:13px;color:var(--marfim);opacity:.85}
.pas .ed{grid-column:1/-1}
.rot-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rot-top .grow{flex:1}
.gat{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.gat button{display:flex;gap:10px;text-align:left;align-items:center}
.gat button.fora{opacity:.55}
.gat button .q{font-weight:600}
.gat button .t{color:var(--apagado);font-size:12px}

#btVoz[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro);color:#1a0f08;font-weight:600}
#btRep[aria-pressed="true"]{border-color:var(--terracota);color:var(--terracota)}

.cxm>summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}.cxm>summary::-webkit-details-marker{display:none}.cxm>summary::before{content:'▸ ';color:var(--ouro)}.cxm[open]>summary::before{content:'▾ '}.cxm[open]>summary{margin-bottom:10px}
.ini2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--linha);border-radius:8px;margin-bottom:6px}.ini2.vez{border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro)}.ini2.caiu{opacity:.5}
.ini2 .n,.n{width:9.5em;max-width:100%}.q{width:4.6em}.c{min-width:8em;flex:1}.pvn{min-width:5.5em}
.apests{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:10px}.apest{display:flex;gap:10px}.apest img{width:64px;height:64px;object-fit:cover;border-radius:8px}.c2{display:flex;flex-direction:column;font-size:12px;gap:2px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}.chk .ok{color:var(--ouro);font-weight:600}
.virt,.jg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}.virt b{min-width:6.5em}.virt.tom b{color:var(--ouro)}.jg.falou .n{opacity:.55}
.lp{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}.lp.atual b{color:var(--ouro)}.lp textarea,.larga{width:100%;box-sizing:border-box}
.dnovo{font-size:22px;font-weight:600;margin-top:8px}.dados{margin-top:6px}.vol2{display:flex;gap:8px;align-items:center;font-size:12px}
.grande2{font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Trilha do Cordeiro</h1>
  <div class="abas" role="tablist">
    <button role="tab" id="abaSel" aria-selected="true">Seleção</button>
    <button role="tab" id="abaTri" aria-selected="false">Triagem</button>
    <button role="tab" id="abaSes" aria-selected="false">Sessão</button>
    <button role="tab" id="abaMes" aria-selected="false">Mestre</button>
  </div>
</header>
<main>
  <div id="avisos"></div>
  <nav class="elenco" id="elenco" aria-label="Personagens"></nav>
  <section id="selecao"></section>
  <section id="triagem" hidden></section>
  <section id="sessao" hidden></section>
  <section id="painelMestre" hidden></section>
</main>

<div class="barra"><div class="in">
  <div class="agora">
    <span id="agoraRosto"></span>
    <div class="tx">
      <div class="rot" id="agoraRot">Tocando agora</div>
      <div class="tit" id="agoraTit">Silêncio</div>
      <div class="tempo" id="agoraTempo">&nbsp;</div>
    </div>
  </div>
  <div class="transp">
    <button id="btAnt" class="peq" title="Tecla P">Anterior</button>
    <button id="btMenos" class="peq" title="Seta para a esquerda">−10 s</button>
    <button id="btPausa" title="Barra de espaço">Pausar</button>
    <button id="btMais" class="peq" title="Seta para a direita">+10 s</button>
    <button id="btProx" class="peq" title="Tecla N">Próxima</button>
  </div>
  <div class="linhaPos"><span id="tAgora">0:00</span><input type="range" id="pos" min="0" max="1000" value="0" aria-label="Posição na música"><span id="tTotal">0:00</span></div>
  <label class="vol">Volume geral <input type="range" id="mestre" min="0" max="100" value="80"></label>
  <button id="btVoz" aria-pressed="false" title="Tecla V: abaixa a música enquanto você fala (segure ou toque)">Voz</button>
  <button id="btVolta" class="peq" title="Tecla R: volta à música anterior, de onde parou">Voltar à anterior</button>
  <button id="btRep" class="peq" title="Tecla T">Repetir</button>
  <button id="btBaixar" title="Tecla B">Baixar aos poucos</button>
  <button id="btSil" class="perigo" title="Tecla Esc">Silêncio</button>
  <button id="btVid" title="Mostra os vídeos, para pular um anúncio">Mostrar vídeos</button>
  <div class="players mini" id="players"><div class="cx"><div id="p0"></div></div><div class="cx"><div id="p1"></div></div><div class="cx"><div id="p2"></div></div></div>
</div></div>
<input type="file" id="arqImg" accept="image/*" hidden>
<input type="file" id="arqDados" accept=".json,application/json" hidden>

<script>
// ---------- Trilha padrão. Cada música tem várias gravações (códigos de vídeo do YouTube), tentadas em ordem. ----------
const F = (id, nome, momento, papel, st, videos) => ({id, nome, momento, papel, st, videos});
const PADRAO = [
 { id:'esau', nome:'Esaú — o caçador', sub:'Canto difônico, caça, lobo.', faixas:[
  F('esau-kongurei','Huun-Huur-Tu — “Kongurei”','Entrada: o caçador ferido na estrada','entrada',1,['_Kvv_tNaXC0','NLErTLjep7M','ppEEAqLuiAU','AYSrbrXiXOY']),
  F('esau-60horses','Huun-Huur-Tu — álbum “60 Horses in My Herd”','Fundo enquanto ele marca o acampamento','momento',0,['KY-6x6ygwK8','hIODrGtYlg8','3_vI8kJ_lD8']),
  F('esau-alash','Alash Ensemble — “Kara Duruyaa”','Entrada mais calma e solene','entrada',0,['H1poWuu8MpI','sK0npp2NLaY','2uY-u9w07S4']),
  F('esau-kaakhem','Yat-Kha — “Kaa-Khem”','Combate cru, quase rock','combate',0,['BKeDseoUZXg','HO39qZK1NNY','pBA_5mD0bnw','KQ1267NG4-I']),
  F('esau-wolftotem','The HU — “Wolf Totem”','Combate: canto difônico com bateria pesada','combate',0,['jM8dCGIm6yc','WQ7XW0_teB4','rMbH9zimuG0','sv29DzgiXZA']),
  F('esau-yuve','The HU — “Yuve Yuve Yu”','Combate alternativo','combate',0,['v4xZUr0BEfE','KpqERx0nyw0','1Gtn1RPXdsg','HqVjBiuRg0c']),
  F('esau-helvegen','Wardruna — “Helvegen”','A flecha que mata a Rafaela (volta 1)','momento',0,['DD65K4VR6Lw','n90SVmnomdM','Fjm93-0ssFo','CuWPsx6U8rU']),

  const esc = t => String(t ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const rot = E.roteiro.map((r,i) => { const f = faixaPorId(r.faixa); return '<tr><td>'+(i+1)+'</td><td><b>'+esc(r.titulo)+'</b><br><span>'+esc(r.nota)+'</span></td><td>'+esc(f ? f.nome : '—')+'</td></tr>'; }).join('');
  const chars = E.grupos.filter(g => g.faixas.some(f => f.usar)).map(g => '<div class="c"><h3>'+esc(g.nome.split(' — ')[0])+'</h3>'+g.faixas.filter(f => f.usar).sort((a,b) => ORDEM.indexOf(a.papel)-ORDEM.indexOf(b.papel)).map(f => '<p><b>'+esc(PAPEIS[f.papel])+':</b> '+esc(f.nome)+(f.momento ? ' <i>('+esc(f.momento)+')</i>' : '')+'</p>').join('')+'</div>').join('');
  w.document.write('<!doctype html><meta charset="utf-8"><title>Folha do Mestre</title><style>@page{size:A4;margin:12mm}body{font:11px/1.35 Georgia,serif;color:#111;margin:0}h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:10px 0 4px;border-bottom:1px solid #444}h3{font-size:12px;margin:0 0 2px}table{border-collapse:collapse;width:100%}td{border:1px solid #999;padding:2px 5px;vertical-align:top}td span{color:#444}.g{columns:2;column-gap:14px}.c{break-inside:avoid;margin-bottom:6px}p{margin:0}.k td:first-child{width:90px;font-weight:bold}</style>'
   + '<h1>O Cordeiro e o Lobo — Folha do Mestre</h1>'
   + '<h2>Regras da noite</h2><p>6 voltas, lírio branco de 6 pétalas (uma pétala cai a cada volta). Abate só vale com a anja em combate. Rodada 3: Hildegarda invoca. Vitória: abater Hildegarda, Jael, Esaú, Ezequiel, Raquel, Ozymandias e o Anjo. Derrota: os Bellacord levam o Tobias.</p>'
   + '<h2>Teclas</h2><table class="k"><tr><td>1 – 9</td><td>tocar o pad</td></tr><tr><td>Espaço</td><td>pausar / continuar</td></tr><tr><td>V</td><td>voz: abaixa a música (toque liga/desliga, segurar solta ao soltar)</td></tr><tr><td>R</td><td>voltar à música anterior, de onde parou</td></tr><tr><td>T</td><td>repetir a faixa</td></tr><tr><td>− / +</td><td>volume da faixa</td></tr><tr><td>← / →</td><td>±10 s</td></tr><tr><td>N / P</td><td>próxima / anterior</td></tr><tr><td>] / [</td><td>próxima / anterior cena do roteiro</td></tr><tr><td>B</td><td>baixar aos poucos</td></tr><tr><td>Esc</td><td>silêncio imediato</td></tr><tr><td>Shift + clique</td><td>entrar sem transição</td></tr></table>'
   + '<h2>Roteiro</h2><table>'+rot+'</table><h2>Músicas escolhidas</h2><div class="g">'+chars+'</div>');
  w.document.close();
}

// ---------- Barra, abas e teclado ----------
const fmt = s => isFinite(s) && s >= 0 ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';
const $ = id => document.getElementById(id);
let arrastando = false;
setInterval(() => {
  const st = tocando && pronto[ativo] ? estadoP() : -1;
  $('btPausa').textContent = st === 2 ? 'Continuar' : 'Pausar';
  $('btVolta').disabled = !hist.length; $('btRep').disabled = !tocando; $('btRep').setAttribute('aria-pressed', String(!!(tocando && tocando.repetir)));
  for (const b of ['btPausa','btMenos','btMais']) $(b).disabled = !tocando;
  $('btAnt').disabled = !(tri ? tri.pos > 0 : tocando && fila.indexOf(tocando) > 0);
  $('btProx').disabled = !(tri ? true : tocando && fila.indexOf(tocando) >= 0 && fila.indexOf(tocando) < fila.length-1);
  if (!tocando || !pronto[ativo]) { $('agoraTempo').innerHTML = '&nbsp;'; $('tAgora').textContent = $('tTotal').textContent = '0:00'; if (!arrastando) $('pos').value = 0; return; }
  let t = 0, d = 0; try { t = P[ativo].getCurrentTime(); d = P[ativo].getDuration(); } catch(e){}
  $('tAgora').textContent = fmt(t); $('tTotal').textContent = fmt(d); if (!arrastando && d) $('pos').value = Math.round(1000*t/d);
  $('agoraTempo').textContent = msgBarra.ate > Date.now() ? msgBarra.t : st === 2 ? 'Em pausa' : st === 3 || espera[ativo] ? 'Carregando…' : (tocando.repetir && !tri ? 'Repetindo' : '\u00a0') + (voz ? ' · voz ligada' : '');
  // se o YouTube abrir mudo ou com outro volume, corrige
  if (st === 1 && !fades[ativo] && !espera[ativo]) { try { if (P[ativo].isMuted() || Math.abs(P[ativo].getVolume() - alvoDe(tocando)) > 2) { vol[ativo] = alvoDe(tocando); aplicarVol(ativo); } } catch(e){} }
  if (tri) { if (st === 1) tri.ms += 500;
    const r = $('triResta'), resta = Math.max(0, (E.previa||120) - tri.ms/1000);
    if (r && !estados[tocando.id]) r.textContent = st === 1 ? 'Passa para a próxima em ' + fmt(resta) : st === 2 ? 'Em pausa' : 'Carregando…';
    if (tri.ms >= (E.previa||120)*1000) triIr(1); }
}, 500);
const m = $('mestre'); m.value = E.mestre;
m.oninput = () => { E.mestre = +m.value; salvar(); if (tocando && !espera[ativo]) { clearInterval(fades[ativo]); fades[ativo] = null; vol[ativo] = alvoDe(tocando); aplicarVol(ativo); } };
const pos = $('pos');
pos.addEventListener('pointerdown', () => { arrastando = true; });
pos.addEventListener('change', () => { arrastando = false; if (!tocando) return; try { P[ativo].seekTo(P[ativo].getDuration()*pos.value/1000, true); } catch(e){} });
$('btPausa').onclick = pausar;
$('btMenos').onclick = () => saltar(-10);
$('btMais').onclick = () => saltar(10);
$('btAnt').onclick = () => vizinha(-1);
$('btProx').onclick = () => vizinha(1);
$('btBaixar').onclick = () => parar(E.fadeSaida*1000);
$('btVoz').onclick = () => alternarVoz();
$('btVolta').onclick = retomar;
$('btRep').onclick = alternarRepetir;
$('btSil').onclick = () => parar(0);
$('btVid').onclick = ev => { const p = $('players'); p.classList.toggle('mini'); ev.target.textContent = p.classList.contains('mini') ? 'Mostrar vídeos' : 'Esconder vídeos'; };
let trava = null;
function aba(qual){ modo = qual;
  for (const [k, sec, bt] of [['sel','selecao','abaSel'],['tri','triagem','abaTri'],['ses','sessao','abaSes'],['mes','painelMestre','abaMes']]) { $(sec).hidden = qual!==k; $(bt).setAttribute('aria-selected', qual===k); }
  if (qual!=='sel' && navigator.wakeLock && !trava) navigator.wakeLock.request('screen').then(w => { trava = w; w.onrelease = () => { trava = null; }; }).catch(()=>{});   // a tela não apaga
  desenhar(); }
$('abaSel').onclick = () => aba('sel');
$('abaTri').onclick = () => aba('tri');
$('abaSes').onclick = () => aba('ses');
$('abaMes').onclick = () => aba('mes');
let vozIni = 0;
document.addEventListener('keyup', ev => { if (ev.key.toLowerCase() === 'v' && !/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) && vozIni && Date.now()-vozIni > 600) alternarVoz(false); vozIni = 0; });
document.addEventListener('keydown', ev => {
  if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === ' ' && ev.target.tagName === 'BUTTON') return;
  if (k === 'escape') { parar(0); ambParar(); }
  else if (k === 'b') parar(E.fadeSaida*1000);
  else if (k === 'v') { if (!ev.repeat) { if (voz) { vozIni = 0; alternarVoz(false); } else { vozIni = Date.now(); alternarVoz(true); } } }
  else if (k === 'r') retomar();
  else if (k === 't') alternarRepetir();
  else if (k === '-') ajustarFaixa(-5);
  else if (k === '=' || k === '+') ajustarFaixa(5);
  else if (k === ' ') { ev.preventDefault(); pausar(); }
  else if (k === 'arrowright') saltar(10);
  else if (k === 'arrowleft') saltar(-10);
  else if (k === 'n') vizinha(1);
  else if (k === 'p') vizinha(-1);
  else if (k === ']') passoCena(1);
  else if (k === '[') passoCena(-1);
  else if (tri && k === 'f') triDecidir(true);
  else if (tri && k === 's') triDecidir(false);
  else if (modo==='ses' && /^[1-9]$/.test(k) && atalhos[+k-1]) tocar(atalhos[+k-1], null, {fila:atalhos});
});
desenhar();
</script>
