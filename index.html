<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha do Cordeiro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Marcellus&display=swap">
<style>
/* Layout: faixa de personagens no topo, duas abas (Seleção para preparar, Sessão para a mesa) e barra de reprodução fixa embaixo. */
:root{
  --fundo:#0e0b09; --painel:#1a1512; --painel2:#241d18; --linha:#3a2f27;
  --marfim:#efe6d2; --apagado:#a8998a; --terracota:#d9763f; --terracota2:#8f4a26; --ouro:#c9a24a; --erro:#e0685a;
  --titulo:'Marcellus SC','Marcellus',Georgia,serif; --texto:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--marfim);font:15px/1.45 var(--texto);padding:0 max(16px,env(safe-area-inset-right,0px)) 300px max(16px,env(safe-area-inset-left,0px))}
header,main{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px 14px;border-bottom:1px solid var(--linha)}
h1{font:400 22px/1 var(--titulo);letter-spacing:.12em;margin:0;color:var(--terracota)}
.abas{display:flex;gap:6px;margin-left:auto}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--linha);background:var(--painel2);border-radius:6px;padding:8px 14px}
button:hover{border-color:var(--terracota2)}
button.peq{padding:5px 10px;font-size:13px}
button.perigo{border-color:#7a2a22;background:#3a1512}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.abas button[aria-selected="true"]{background:var(--terracota);border-color:var(--terracota);color:#1a0f08;font-weight:600}
.aviso{margin:14px 0;padding:12px 14px;border:1px solid var(--erro);border-radius:6px;background:#2a1512;color:#ffd9d2;display:flex;gap:12px;align-items:start}
.aviso span{flex:1}
.aviso code{background:#0006;padding:1px 5px;border-radius:3px}
/* Personagens */
.elenco{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:thin}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;white-space:nowrap;flex:none}
.chip.so{padding-left:12px}
.chip[aria-pressed="true"]{background:var(--terracota);border-color:var(--terracota);color:#1a0f08;font-weight:600}
.rosto{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--linha);display:grid;place-items:center;font:400 14px/1 var(--titulo);color:var(--marfim);flex:none}
.chip .n{font-size:11px;opacity:.7}
h2{font:400 20px/1.2 var(--titulo);letter-spacing:.1em;margin:0;color:var(--marfim)}
h3{font:400 14px/1.2 var(--titulo);letter-spacing:.12em;margin:26px 0 10px;color:var(--terracota)}
.sub{color:var(--apagado);margin:0;font-size:13px}
/* Cabeçalho do personagem */
.pers{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:14px 0 18px;padding:14px;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.retrato{width:112px;height:112px;border-radius:8px;object-fit:cover;background:var(--painel2);border:1px solid var(--linha);display:grid;place-items:center;font:400 40px/1 var(--titulo);color:var(--terracota2);flex:none}
.pers .info{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px}
.pers .acoes{display:flex;flex-wrap:wrap;gap:6px}
.pers input.nome{font:400 18px/1.2 var(--titulo);letter-spacing:.06em;width:100%}
.pers input.subt{width:100%;font-size:13px}
.banner{display:flex;gap:16px;align-items:center;margin:18px 0 12px}
.banner .retrato{width:88px;height:88px}
/* Faixas */
.faixa{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:start;padding:14px;border:1px solid var(--linha);border-radius:8px;background:var(--painel);margin-bottom:10px}
.faixa.fora{opacity:.6}
.faixa .usar{margin-top:3px;width:20px;height:20px;accent-color:var(--terracota)}
.faixa .nome{font-weight:600}
.st{color:var(--ouro);margin-right:4px}
.faixa .momento{color:var(--apagado);font-size:13px}
.faixa .estado{font-size:12px;margin-top:4px;color:var(--apagado)}
.faixa .estado.ruim{color:var(--erro)}
.ctrl{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end}
label.c{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado)}
label.lin{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:7px}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--marfim);background:var(--fundo);border:1px solid var(--linha);border-radius:5px;padding:6px 8px;max-width:100%}
input[type=number]{width:74px}
input[type=text]{width:230px}
input[type=text].largo{width:340px}
input[type=range]{accent-color:var(--terracota);width:110px}
.ouvir.tocando{background:var(--terracota);border-color:var(--terracota);color:#1a0f08;font-weight:600}
.editar{grid-column:2/-1;margin:0;border:0;padding:0;background:none}
.editar summary{font-size:12px;color:var(--apagado);font-weight:400}
.editar .ctrl{margin-top:10px}
a{color:var(--terracota)}
details.cx{margin:14px 0;border:1px solid var(--linha);border-radius:8px;padding:10px 14px;background:var(--painel)}
summary{cursor:pointer;font-weight:600}
.novo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;margin-top:12px}
textarea{width:100%;height:90px;margin:10px 0;font:12px/1.4 ui-monospace,Consolas,monospace}
.lin2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
/* Sessão */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cena{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:104px;padding:14px;border-radius:8px;background:var(--painel)}
.cena .papel{font:400 11px/1 var(--titulo);letter-spacing:.14em;color:var(--terracota)}
.cena .t{font-weight:600;font-size:16px;line-height:1.25}
.cena .m{font-size:12.5px;color:var(--apagado)}
.cena .tecla{margin-top:auto;font-size:11px;color:var(--apagado)}
.cena.tocando{background:var(--terracota);border-color:var(--terracota);color:#1a0f08}
.cena.tocando .papel,.cena.tocando .m,.cena.tocando .tecla{color:#3a1d0c}
.vazio{color:var(--apagado);padding:14px 0}
/* Barra */
.barra{position:fixed;left:0;right:0;bottom:0;background:#120e0b;border-top:1px solid var(--terracota2);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.barra .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.agora{flex:1 1 240px;min-width:0;display:flex;gap:12px;align-items:center}
.agora .rosto{width:44px;height:44px}
.agora .tx{min-width:0}
.agora .rot{font:400 11px/1 var(--titulo);letter-spacing:.14em;color:var(--apagado)}
.agora .tit{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agora .tempo{font-size:12px;color:var(--apagado);font-variant-numeric:tabular-nums}
.barra .vol{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--apagado)}
.barra .vol input{width:140px}
.players{display:flex;gap:8px}
.players .cx{width:200px;height:200px;background:#000;border:1px solid var(--linha);border-radius:4px;overflow:hidden}
.players.mini{position:absolute;left:-9999px}
@media (max-width:640px){.faixa{grid-template-columns:auto 1fr}.faixa .ouvir{grid-column:2;justify-self:start}.ctrl,.editar{grid-column:1/-1}.players .cx{width:150px;height:150px}body{padding-bottom:380px}}
</style>
</head>
<body>
<header>
  <h1>Trilha do Cordeiro</h1>
  <div class="abas" role="tablist">
    <button role="tab" id="abaSel" aria-selected="true">Seleção</button>
    <button role="tab" id="abaSes" aria-selected="false">Sessão</button>
  </div>
</header>
<main>
  <div id="avisos"></div>
  <nav class="elenco" id="elenco" aria-label="Personagens"></nav>
  <section id="selecao"></section>
  <section id="sessao" hidden></section>
</main>

<div class="barra"><div class="in">
  <div class="agora">
    <span id="agoraRosto"></span>
    <div class="tx">
      <div class="rot" id="agoraRot">Tocando agora</div>
      <div class="tit" id="agoraTit">Silêncio</div>
      <div class="tempo" id="agoraTempo">&nbsp;</div>
    </div>
  </div>
  <label class="vol">Volume geral <input type="range" id="mestre" min="0" max="100" value="80"></label>
  <button id="btBaixar" title="Tecla B">Baixar aos poucos</button>
  <button id="btSil" class="perigo" title="Tecla Esc">Silêncio</button>
  <button id="btVid" title="Mostra os vídeos, para pular um anúncio">Mostrar vídeos</button>
  <div class="players mini" id="players"><div class="cx"><div id="p0"></div></div><div class="cx"><div id="p1"></div></div></div>
</div></div>
<input type="file" id="arqImg" accept="image/*" hidden>
<input type="file" id="arqDados" accept=".json,application/json" hidden>

m.oninput = () => { E.mestre = +m.value; salvar(); if (tocando) { clearInterval(fades[ativo]); try { P[ativo].setVolume(alvoDe(tocando)); } catch(e){} } };
document.getElementById('btBaixar').onclick = () => parar(4000);
document.getElementById('btSil').onclick = () => parar(0);
document.getElementById('btVid').onclick = ev => { const p = document.getElementById('players'); p.classList.toggle('mini'); ev.target.textContent = p.classList.contains('mini') ? 'Mostrar vídeos' : 'Esconder vídeos'; };
let trava = null;
function aba(qual){ modo = qual;
  document.getElementById('selecao').hidden = qual!=='sel'; document.getElementById('sessao').hidden = qual!=='ses';
  document.getElementById('abaSel').setAttribute('aria-selected', qual==='sel'); document.getElementById('abaSes').setAttribute('aria-selected', qual==='ses');
  if (qual==='ses' && navigator.wakeLock && !trava) navigator.wakeLock.request('screen').then(w => { trava = w; w.onrelease = () => { trava = null; }; }).catch(()=>{});   // a tela não apaga durante a sessão
  desenhar(); }
document.getElementById('abaSel').onclick = () => aba('sel');
document.getElementById('abaSes').onclick = () => aba('ses');
document.addEventListener('keydown', ev => {
  if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === 'Escape') parar(0);
  else if (ev.key.toLowerCase() === 'b') parar(4000);
  else if (modo==='ses' && /^[1-9]$/.test(ev.key) && atalhos[+ev.key-1]) tocar(atalhos[+ev.key-1]);
});
desenhar();
</script>
